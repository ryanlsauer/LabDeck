  { id: "l-ref", unit: "math", title: "Reference intervals and critical values", mins: 8,
    steps: [
      T("What “normal” really means", "A reference interval covers the central 95% of results from a healthy reference population, roughly the mean ±2 SD for normally distributed tests. That means about 5% of healthy people fall outside it. An abnormal flag isn’t automatically disease.\n\nIntervals vary by method, age, sex and population, so always use the ones your lab has established.", "A reference interval is the central 95% of healthy people."),
      T("Critical values", "A critical value is so abnormal it may be life-threatening, such as a potassium of 6.8 mmol/L. It must be reported to a responsible provider right away. The person receiving it reads it back, and you document who you told and when."),
      Q("About what percentage of healthy people have a result outside the reference interval for a given test?", ["5%", "0%", "1%", "25%"], 0, "The interval holds the central 95%, leaving about 5% of healthy people outside it."),
      T("Sensitivity, specificity and delta checks", "Sensitivity is how well a test detects people who have the disease; specificity is how well it identifies people who don’t.\n\nA delta check compares a patient’s result with their previous one. A big unexplained change can reveal a mislabeled or contaminated specimen.", "", "SnNout: a highly Sensitive test that’s Negative rules disease out. SpPin: a highly Specific test that’s Positive rules it in.")
    ],
    quiz: [
      ["A reference interval usually represents:", ["The central 95% of a healthy population", "Every possible healthy value", "The range in sick patients", "The mean ±1 SD"], 0, "About 95% of healthy people fall within it."],
      ["After reporting a critical value by phone, you should:", ["Have it read back and document who and when", "Wait for the provider to call back", "Only enter it in the computer", "Repeat the test three times first"], 0, "Read-back and documentation are required."],
      ["Which test is best for ruling a disease out?", ["One with high sensitivity", "One with high specificity", "One with a low CV", "Any test with a reference interval"], 0, "SnNout."],
      ["A delta check flags:", ["A big change from the patient’s previous result", "A control outside 2 SD", "A test with low sensitivity", "A hemolyzed specimen"], 0, "Delta checks compare current and prior results."]
    ],
    terms: [["Reference interval", "Central 95% of healthy results"], ["Sensitivity", "Ability to detect those with disease"], ["Specificity", "Ability to identify those without disease"], ["Delta check", "Comparison with a patient’s prior result"]] },
  { id: "l-blood", unit: "heme", title: "Blood and where it comes from", mins: 9,
    steps: [
      T("Plasma, serum and cells", "Whole blood is roughly 55% plasma and 45% cells. Plasma is the liquid part of anticoagulated blood and still contains clotting factors, including fibrinogen. Serum is what’s left after blood clots; the clotting factors were used up, so serum has no fibrinogen.", "Serum = plasma minus the clotting factors."),
      T("Hematopoiesis", "All blood cells come from hematopoietic stem cells in the red bone marrow. They split into two lineages.\n\nMyeloid: RBCs, platelets (made by megakaryocytes), neutrophils, eosinophils, basophils and monocytes.\n\nLymphoid: B cells, T cells and NK cells.\n\nThe kidneys release erythropoietin (EPO) when oxygen is low, signaling the marrow to make more RBCs."),
      Q("Which cell produces platelets?", ["Megakaryocyte", "Monocyte", "Lymphoblast", "Reticulocyte"], 0, "Platelets are fragments of megakaryocyte cytoplasm."),
      T("Lifespans", "RBCs live about 120 days before the spleen removes them. Platelets last about 8 to 10 days. Neutrophils circulate for only hours before moving into tissues."),
      T("The CBC", "A complete blood count reports WBC, RBC, hemoglobin, hematocrit, the RBC indices (MCV, MCH, MCHC), RDW and platelets, often with a WBC differential. A reticulocyte count shows how hard the marrow is working to replace RBCs.")
    ],
    quiz: [
      ["Serum differs from plasma because it lacks:", ["Fibrinogen", "Albumin", "Glucose", "Water"], 0, "Fibrinogen is consumed when blood clots."],
      ["The normal RBC lifespan is about:", ["120 days", "10 days", "30 days", "1 year"], 0, "About 120 days."],
      ["Erythropoietin is produced mainly by the:", ["Kidneys", "Liver", "Spleen", "Bone marrow"], 0, "The kidneys sense low oxygen and release EPO."],
      ["Lymphocytes come from which lineage?", ["Lymphoid", "Myeloid", "Erythroid", "Megakaryocytic"], 0, "B, T and NK cells are lymphoid."]
    ],
    terms: [["Plasma", "Liquid portion of anticoagulated blood, with clotting factors"], ["Serum", "Liquid left after clotting; no fibrinogen"], ["Hematopoiesis", "Blood cell production"], ["Erythropoietin", "Kidney hormone that stimulates RBC production"]],
    unlock: [{ pack: "rr-heme" }], tool: "ranges" },
  { id: "l-wbc", unit: "heme", title: "White blood cells", mins: 10,
    steps: [
      T("The five WBCs", "Five types of WBCs circulate normally. From most to least common: neutrophils, lymphocytes, monocytes, eosinophils, basophils.", "", "Never Let Monkeys Eat Bananas: the five WBCs in order of how common they are."),
      T("What each one does", "Neutrophils engulf bacteria; bands are younger neutrophils, and more bands than usual is a left shift, a sign of acute infection.\n\nLymphocytes include B cells, which make antibodies, and T and NK cells. Reactive lymphocytes appear in viral infections like mononucleosis.\n\nMonocytes become macrophages in tissue.\n\nEosinophils rise with allergies and parasites.\n\nBasophils release histamine and are increased in CML."),
      Q("An increase in eosinophils most suggests:", ["Parasitic infection or allergy", "Bacterial infection", "Viral infection", "Bleeding"], 0, "Eosinophils respond to parasites and allergic reactions."),
      T("Relative versus absolute counts", "A differential gives percentages, which can mislead. Absolute count = WBC × percent. A neutrophil percentage of 80% means something very different with a WBC of 2.0 than with 20.0. Clinicians rely on absolute counts for decisions such as neutropenia.")
    ],
    quiz: [
      ["Which WBC is normally most abundant in adults?", ["Neutrophil", "Lymphocyte", "Monocyte", "Eosinophil"], 0, "Neutrophils are usually 50 to 70% of WBCs."],
      ["In tissue, monocytes become:", ["Macrophages", "Plasma cells", "Mast cells", "Megakaryocytes"], 0, "Monocytes mature into macrophages."],
      ["A left shift means:", ["More bands and younger neutrophils", "More lymphocytes", "Fewer neutrophils", "Smaller RBCs"], 0, "The marrow releases immature neutrophils during acute infection."],
      ["WBC 10.0 ×10³/µL with 60% neutrophils gives an absolute neutrophil count of:", ["6.0 ×10³/µL", "60 ×10³/µL", "0.6 ×10³/µL", "16 ×10³/µL"], 0, "10.0 × 0.60 = 6.0."]
    ],
    terms: [["Left shift", "Increased bands and immature neutrophils"], ["Reactive lymphocyte", "Large lymphocyte with abundant cytoplasm, seen in viral infections"], ["Absolute count", "WBC × percent"]],
    unlock: [{ pack: "wbc" }], tool: "math" },
  { id: "l-rbc", unit: "heme", title: "RBC indices and morphology", mins: 11,
    steps: [
      T("The indices", "MCV = (Hct × 10) ÷ RBC: average cell size, in fL.\n\nMCH = (Hgb × 10) ÷ RBC: average hemoglobin per cell, in pg.\n\nMCHC = (Hgb ÷ Hct) × 100: hemoglobin concentration in cells, in g/dL.\n\nRDW measures variation in cell size (anisocytosis)."),
      T("Classifying by size", "MCV under 80 fL is microcytic, 80 to 100 is normocytic, over 100 is macrocytic. A low MCHC means hypochromic (pale) cells. An increased MCHC is uncommon and suggests spherocytes.", "MCV sorts anemias into microcytic, normocytic and macrocytic."),
      Q("Hct is 45% and the RBC count is 5.0 ×10⁶/µL. What is the MCV?", ["90 fL", "45 fL", "9 fL", "225 fL"], 0, "(45 × 10) ÷ 5.0 = 90 fL."),
      T("The rule of three", "For normocytic, normochromic samples, hemoglobin × 3 ≈ hematocrit (within about 3). When it doesn’t hold, check for an instrument problem, lipemia or an abnormal cell population before reporting."),
      T("Shapes and inclusions to know first", "Schistocytes (fragments): DIC, TTP, HUS. Spherocytes: hereditary spherocytosis, autoimmune hemolysis. Target cells: thalassemia, liver disease. Sickle cells: Hb SS. Teardrops: myelofibrosis.\n\nInclusions: Howell-Jolly bodies (after splenectomy), basophilic stippling (lead poisoning), Heinz bodies (G6PD deficiency, supravital stain only).")
    ],
    quiz: [
      ["A high MCHC suggests:", ["Spherocytes", "Iron deficiency", "Thalassemia", "B12 deficiency"], 0, "Spherocytes are the classic cause of increased MCHC."],
      ["Schistocytes are most associated with:", ["DIC and TTP", "Iron deficiency", "Myelofibrosis", "Lead poisoning"], 0, "They’re RBCs sheared in damaged small vessels."],
      ["RDW measures:", ["Variation in RBC size", "Average RBC size", "Hemoglobin per cell", "Reticulocytes"], 0, "RDW reflects anisocytosis."],
      ["Hgb 12.0 g/dL predicts a hematocrit of about:", ["36%", "12%", "24%", "48%"], 0, "Rule of three: 12 × 3 = 36."]
    ],
    terms: [["MCV", "Average RBC volume"], ["MCHC", "Hemoglobin concentration in RBCs"], ["Anisocytosis", "Variation in RBC size"], ["Poikilocytosis", "Variation in RBC shape"]],
    unlock: [{ pack: "rbc" }], tool: "math" },
  { id: "l-anemia", unit: "heme", title: "Working up an anemia", mins: 12,
    steps: [
      T("Two questions first", "Anemia means a low hemoglobin. Start with two questions. What’s the MCV? And is the marrow responding? A high reticulocyte count means the marrow is working hard to replace lost or destroyed cells (bleeding or hemolysis). A low count points to a production problem."),
      T("Microcytic anemias", "Iron deficiency: low ferritin, high TIBC, high RDW. Most common worldwide.\n\nAnemia of chronic disease: normal or high ferritin, low TIBC.\n\nThalassemia trait: normal ferritin, normal or high RBC count, Mentzer index (MCV ÷ RBC) under 13.\n\nSideroblastic anemia: high iron, ringed sideroblasts.", "Ferritin is the best single test for iron stores.", "TAILS for microcytic anemia: Thalassemia, Anemia of chronic disease, Iron deficiency, Lead poisoning, Sideroblastic."),
      Q("Low ferritin with high TIBC points to:", ["Iron deficiency", "Anemia of chronic disease", "Thalassemia trait", "Folate deficiency"], 0, "Empty iron stores with a body hungry for iron."),
      T("Macrocytic anemias", "B12 and folate deficiencies cause megaloblastic anemia with oval macrocytes and hypersegmented neutrophils. Methylmalonic acid rises only in B12 deficiency, and B12 deficiency can damage nerves. Liver disease and alcohol cause macrocytosis without megaloblastic changes."),
      T("Hemolytic anemias", "Signs of hemolysis: high retic count, high indirect bilirubin, high LD, low haptoglobin (it binds free hemoglobin and gets used up).\n\nThe DAT separates immune from non-immune causes: positive in autoimmune hemolytic anemia, negative in hereditary spherocytosis, sickle cell disease and G6PD deficiency.")
    ],
    quiz: [
      ["Which test separates B12 deficiency from folate deficiency?", ["Methylmalonic acid", "MCV", "Hypersegmented neutrophils", "Reticulocyte count"], 0, "MMA rises in B12 deficiency only."],
      ["In hemolysis, haptoglobin is usually:", ["Decreased", "Increased", "Normal", "Not measurable"], 0, "It binds free hemoglobin and is cleared."],
      ["A positive DAT with spherocytes suggests:", ["Warm autoimmune hemolytic anemia", "Hereditary spherocytosis", "Iron deficiency", "Thalassemia"], 0, "HS is DAT negative; immune hemolysis is DAT positive."],
      ["A high reticulocyte count means:", ["The marrow is responding", "The marrow is failing", "Iron stores are full", "B12 is low"], 0, "More young RBCs are being released."]
    ],
    terms: [["Ferritin", "Storage iron; best single test of iron stores"], ["TIBC", "Total iron-binding capacity; rises in iron deficiency"], ["Haptoglobin", "Binds free hemoglobin; low in hemolysis"], ["Mentzer index", "MCV ÷ RBC; under 13 suggests thalassemia trait"]],
    unlock: [{ pack: "anemias" }], tool: "cases" },
  { id: "l-leuk", unit: "heme", title: "Leukemia basics", mins: 9,
    steps: [
      T("Acute or chronic, myeloid or lymphoid", "Leukemia is an uncontrolled growth of WBC precursors. Acute leukemias are dominated by blasts and progress quickly; under the WHO system, at least 20% blasts in blood or marrow generally defines acute myeloid leukemia. Chronic leukemias involve more mature cells and progress more slowly. Each can be myeloid or lymphoid, giving four main types."),
      T("The big four", "AML: mostly adults; Auer rods in blasts confirm a myeloid origin.\n\nALL: the most common childhood cancer.\n\nCML: very high WBC with all stages of granulocyte maturation and basophilia; defined by the Philadelphia chromosome, t(9;22), which creates BCR::ABL1.\n\nCLL: older adults; many small, mature lymphocytes and smudge cells.", "Auer rods = myeloid. Philadelphia chromosome = CML."),
      Q("Smudge cells on a smear of an older adult with lymphocytosis suggest:", ["CLL", "AML", "CML", "ALL"], 0, "Fragile CLL lymphocytes smear into smudge cells."),
      T("Leukemoid reaction versus CML", "A leukemoid reaction is a very high WBC caused by severe infection or inflammation. It lacks basophilia and BCR::ABL1, and toxic changes in neutrophils are common.")
    ],
    quiz: [
      ["Auer rods indicate a blast is:", ["Myeloid", "Lymphoid", "Erythroid", "Reactive"], 0, "Auer rods are fused granules seen in myeloid blasts."],
      ["The most common childhood leukemia is:", ["ALL", "AML", "CML", "CLL"], 0, "ALL is the most common childhood cancer."],
      ["The Philadelphia chromosome is characteristic of:", ["CML", "CLL", "AML with Auer rods", "A leukemoid reaction"], 0, "t(9;22) creates BCR::ABL1."],
      ["Which favors a leukemoid reaction over CML?", ["No basophilia and no BCR::ABL1", "Marked basophilia", "Splenomegaly with BCR::ABL1", "Many smudge cells"], 0, "CML has basophilia and BCR::ABL1."]
    ],
    terms: [["Blast", "The earliest recognizable precursor cell"], ["Auer rod", "Rod-shaped granule fusion in myeloid blasts"], ["Philadelphia chromosome", "t(9;22), BCR::ABL1, defines CML"]], tool: "cases" },
  { id: "l-hemostasis", unit: "hemo", title: "How bleeding stops", mins: 11,
    steps: [
      T("Primary hemostasis: the platelet plug", "When a vessel is injured, it constricts. Platelets stick to exposed collagen using von Willebrand factor, become activated, and clump together as fibrinogen bridges their GPIIb/IIIa receptors. The result is a soft platelet plug."),
      T("Secondary hemostasis: the fibrin clot", "The coagulation cascade generates thrombin, which turns fibrinogen into fibrin. Factor XIII cross-links the fibrin, locking the clot in place.\n\nExtrinsic pathway: tissue factor and factor VII.\nIntrinsic pathway: factors XII, XI, IX and VIII.\nCommon pathway: factors X, V, II (prothrombin) and I (fibrinogen).\n\nMost steps need calcium. That’s why citrate and EDTA, which bind calcium, keep blood from clotting in the tube.", "Thrombin converts fibrinogen to fibrin.", "Vitamin K factors: think “1972”: factors 10, 9, 7 and 2."),
      Q("Which factors are vitamin K dependent?", ["II, VII, IX and X", "I, V, VIII and XIII", "VIII, IX, XI and XII", "Only VII"], 0, "1972: X, IX, VII, II. Warfarin works by blocking vitamin K."),
      T("Breaking the clot down", "Once healing begins, plasmin digests fibrin (fibrinolysis). D-dimer is a breakdown product of cross-linked fibrin, so a high D-dimer means clots have formed and are being broken down, as in DIC or a blood clot in the legs or lungs.")
    ],
    quiz: [
      ["Platelets stick to collagen using:", ["von Willebrand factor", "Fibrin", "Plasmin", "Factor VII"], 0, "vWF links platelet GPIb to collagen."],
      ["Which enzyme converts fibrinogen to fibrin?", ["Thrombin", "Plasmin", "Factor XIII", "Tissue factor"], 0, "Thrombin cleaves fibrinogen."],
      ["D-dimer comes from the breakdown of:", ["Cross-linked fibrin by plasmin", "Fibrinogen by thrombin", "Platelets", "Factor VIII"], 0, "Only cross-linked fibrin yields D-dimer."],
      ["Anticoagulants like citrate prevent clotting by:", ["Binding calcium", "Destroying platelets", "Blocking vitamin K", "Activating plasmin"], 0, "Calcium is needed throughout the cascade."]
    ],
    terms: [["Primary hemostasis", "Formation of the platelet plug"], ["Secondary hemostasis", "Formation of the fibrin clot"], ["Fibrinolysis", "Breakdown of fibrin by plasmin"], ["D-dimer", "Breakdown product of cross-linked fibrin"]],
    unlock: [{ pack: "coag" }] },
  { id: "l-coagtests", unit: "hemo", title: "Coagulation testing", mins: 11,
    steps: [
      T("The specimen", "Coagulation tests use a light blue 3.2% sodium citrate tube filled to the line for a 9:1 blood-to-anticoagulant ratio. Underfilling leaves extra citrate and falsely prolongs clotting times. Testing uses platelet-poor plasma."),
      T("PT and aPTT", "PT (with INR) adds tissue factor and tests the extrinsic and common pathways. It’s used to monitor warfarin; INR standardizes PT results between labs.\n\naPTT tests the intrinsic and common pathways. It monitors unfractionated heparin and is prolonged in hemophilia A and B and with a lupus anticoagulant.", "PT/INR monitors warfarin. aPTT monitors heparin.", "WEPT: Warfarin works on the Extrinsic pathway, monitored with PT. HIP: Heparin, Intrinsic pathway, PTT."),
      Q("A patient on warfarin is monitored with:", ["PT/INR", "aPTT", "Platelet count", "D-dimer"], 0, "Warfarin lowers factors II, VII, IX and X; PT is most sensitive to factor VII."),
      T("Mixing studies", "When a clotting time is long, mix patient plasma 1:1 with normal plasma. If the time corrects, the patient was missing a factor. If it stays long, an inhibitor such as a lupus anticoagulant or a factor VIII antibody is blocking clotting."),
      T("Reading the pattern", "Only PT long: factor VII deficiency, early warfarin or vitamin K deficiency, early liver disease.\nOnly aPTT long: factors VIII, IX, XI or XII, heparin, lupus anticoagulant.\nBoth long: common pathway factors, DIC, severe liver disease, significant vitamin K deficiency.")
    ],
    quiz: [
      ["An underfilled light blue tube gives:", ["Falsely prolonged PT and aPTT", "Falsely short PT and aPTT", "Hemolysis", "Falsely high platelets"], 0, "Too much citrate for the plasma volume."],
      ["A prolonged aPTT that corrects on mixing suggests:", ["A factor deficiency", "A lupus anticoagulant", "A factor VIII inhibitor", "Heparin contamination only"], 0, "Normal plasma supplies the missing factor."],
      ["An isolated long PT with normal aPTT most suggests:", ["Factor VII deficiency", "Hemophilia A", "Hemophilia B", "Factor XII deficiency"], 0, "Factor VII is the only factor unique to the extrinsic pathway."],
      ["Unfractionated heparin is monitored with:", ["aPTT", "PT/INR", "Bleeding time", "Fibrinogen"], 0, "aPTT, or anti-Xa in many labs."]
    ],
    terms: [["PT/INR", "Tests extrinsic and common pathways; monitors warfarin"], ["aPTT", "Tests intrinsic and common pathways; monitors heparin"], ["Mixing study", "1:1 mix with normal plasma; correction means factor deficiency"]],
    unlock: [{ pack: "rr-coag" }], tool: "cases" },
  { id: "l-lytes", unit: "chem", title: "Electrolytes and acid-base", mins: 12,
    steps: [
      T("The four main electrolytes", "Sodium is the main extracellular cation and controls fluid balance. Potassium is the main intracellular cation and is critical for heart rhythm; hemolysis falsely raises it. Chloride follows sodium. Bicarbonate is the main blood buffer.\n\nAnion gap = Na − (Cl + HCO₃). A high gap means unmeasured acids are present.", "Hemolysis falsely raises potassium."),
      T("Acid-base basics", "Normal blood pH is 7.35 to 7.45. The lungs control pCO₂ (the respiratory side) and the kidneys control bicarbonate (the metabolic side).\n\nLow pH is acidosis; high pH is alkalosis. If pCO₂ explains the change, it’s respiratory. If bicarbonate explains it, it’s metabolic. The body compensates by shifting the other side.", "", "ROME: Respiratory Opposite (pH and pCO₂ move in opposite directions), Metabolic Equal (pH and HCO₃ move the same way)."),
      Q("pH 7.25 with a low bicarbonate is:", ["Metabolic acidosis", "Respiratory acidosis", "Metabolic alkalosis", "Respiratory alkalosis"], 0, "Low pH and low HCO₃ move together, so it’s metabolic."),
      T("High anion gap acidosis", "Causes include ketoacidosis (DKA), lactic acidosis, kidney failure and toxins like methanol, ethylene glycol and salicylates.", "", "MUDPILES: Methanol, Uremia, DKA, Propylene glycol, Isoniazid or iron, Lactic acidosis, Ethylene glycol, Salicylates.")
    ],
    quiz: [
      ["The main intracellular cation is:", ["Potassium", "Sodium", "Calcium", "Chloride"], 0, "Most potassium sits inside cells."],
      ["Na 140, Cl 100, HCO₃ 24. The anion gap is:", ["16", "40", "64", "4"], 0, "140 − (100 + 24) = 16."],
      ["pH 7.50 with a low pCO₂ is:", ["Respiratory alkalosis", "Metabolic alkalosis", "Respiratory acidosis", "Metabolic acidosis"], 0, "pH and pCO₂ move opposite, so it’s respiratory."],
      ["Which causes a high anion gap acidosis?", ["Diabetic ketoacidosis", "Vomiting", "Hyperventilation", "Diuretics"], 0, "Ketoacids are unmeasured anions."]
    ],
    terms: [["Anion gap", "Na − (Cl + HCO₃)"], ["Acidosis", "pH below 7.35"], ["Alkalosis", "pH above 7.45"], ["Compensation", "The opposite system adjusts to bring pH back toward normal"]],
    unlock: [{ pack: "rr-chem" }], tool: "math" },
  { id: "l-glu", unit: "chem", title: "Glucose, kidneys and liver", mins: 12,
    steps: [
      T("Glucose and diabetes", "Fasting glucose is normally 70 to 99 mg/dL. Diabetes is diagnosed with a fasting glucose of 126 mg/dL or higher or an HbA1c of 6.5% or higher, confirmed on repeat testing. HbA1c reflects average glucose over the previous 2 to 3 months, tied to the RBC lifespan.\n\nGlucose falls in unprocessed blood as cells use it, about 5 to 7% per hour, which is why the gray top contains fluoride.", "HbA1c shows the past 2 to 3 months."),
      T("The kidneys", "BUN and creatinine both rise when the kidneys filter poorly. Creatinine comes from muscle at a steady rate, so it’s a better marker of filtration. Creatinine clearance and eGFR estimate the glomerular filtration rate."),
      T("Bilirubin’s journey", "Old RBCs break down into unconjugated (indirect) bilirubin, which travels on albumin to the liver. The liver conjugates it into water-soluble conjugated (direct) bilirubin and sends it out in bile. Gut bacteria turn it into urobilinogen.\n\nPrehepatic (hemolysis): indirect bilirubin and urine urobilinogen rise; no bilirubin in urine.\nHepatic: both forms can rise.\nPosthepatic (obstruction): direct bilirubin rises, urine bilirubin is positive, urobilinogen falls, stools turn pale.", "Only conjugated bilirubin is water-soluble enough to appear in urine."),
      Q("Bilirubin appears in urine in which situation?", ["Bile duct obstruction", "Hemolysis only", "Iron deficiency", "Never"], 0, "Conjugated bilirubin backs up into blood and spills into urine."),
      T("Liver enzymes", "ALT is the most liver-specific enzyme. AST also comes from heart and skeletal muscle. ALP rises sharply with bile duct obstruction and also with bone growth or disease.")
    ],
    quiz: [
      ["HbA1c reflects average glucose over about:", ["2 to 3 months", "1 day", "1 week", "1 year"], 0, "It tracks the RBC lifespan."],
      ["Creatinine is produced by:", ["Muscle", "The liver", "The kidneys", "Red blood cells"], 0, "Creatinine comes from muscle creatine."],
      ["A very high ALP with high direct bilirubin suggests:", ["Bile duct obstruction", "Hemolysis", "Gilbert syndrome", "Iron deficiency"], 0, "Obstruction drives ALP and conjugated bilirubin up."],
      ["The most liver-specific enzyme is:", ["ALT", "AST", "LD", "CK"], 0, "AST also comes from heart and muscle."]
    ],
    terms: [["HbA1c", "Glycated hemoglobin; 2 to 3 month glucose average"], ["Unconjugated bilirubin", "Indirect; bound to albumin; not in urine"], ["Conjugated bilirubin", "Direct; water-soluble; can appear in urine"], ["eGFR", "Estimated glomerular filtration rate"]], tool: "cases" },
  { id: "l-markers", unit: "chem", title: "Heart, thyroid and proteins", mins: 9,
    steps: [
      T("Cardiac markers", "Cardiac troponin (I or T) is the most specific marker of heart muscle injury. Labs test it serially; a rise between samples supports an acute heart attack. BNP and NT-proBNP rise in heart failure."),
      T("Thyroid testing", "The pituitary releases TSH, which tells the thyroid to make T4 and T3. Thyroid hormone then turns TSH down (negative feedback). TSH is the best first screening test.\n\nPrimary hypothyroidism: high TSH, low free T4.\nPrimary hyperthyroidism (such as Graves disease): low TSH, high free T4.", "In primary thyroid disease, TSH moves opposite to free T4."),
      Q("TSH low and free T4 high suggests:", ["Primary hyperthyroidism", "Primary hypothyroidism", "Pituitary failure", "Normal thyroid"], 0, "Excess thyroid hormone suppresses TSH."),
      T("Proteins", "Albumin is the most abundant plasma protein and holds fluid in vessels. Serum protein electrophoresis separates proteins into bands; a sharp monoclonal spike (M-spike) in the gamma region suggests multiple myeloma, often with Bence Jones proteins (free light chains) in the urine.")
    ],
    quiz: [
      ["The most specific marker of myocardial injury is:", ["Cardiac troponin", "CK", "Myoglobin", "LD"], 0, "Troponins are essentially heart-specific."],
      ["The best first thyroid screening test is:", ["TSH", "Total T4", "T3", "Thyroglobulin"], 0, "TSH responds sensitively to thyroid status."],
      ["An M-spike on protein electrophoresis suggests:", ["Multiple myeloma", "Liver disease", "Nephrotic syndrome", "Dehydration"], 0, "A monoclonal protein from one clone of plasma cells."],
      ["The most abundant plasma protein is:", ["Albumin", "Fibrinogen", "IgG", "Transferrin"], 0, "Albumin makes up over half of total protein."]
    ],

function lessonFacts(l) {

}

/* ---------- Select all that apply ---------- */
const itemsOf = (c, f) => splitItems((c.values || {})[f]);
const hasItem = (c, f, item) => itemsOf(c, f).some(x => norm(x) === norm(item));
function buildSATA(d, count) {
  const P = d.cards.filter(c => c.type === "profile");
  const fields = d.fields.filter(f => f !== d.orderField);
  const qs = []; let guard = 0;
  while (qs.length < count && guard++ < count * 12) {
    if (Math.random() < 0.55) {
      // "Select everything true of X"
      const c = P[Math.floor(Math.random() * P.length)];
      const filled = fields.filter(f => itemsOf(c, f).length);
      if (filled.length < 2) continue;
      const trues = pick(filled, Math.min(filled.length, 1 + Math.floor(Math.random() * 3))).map(f => ({ field: f, text: pick(itemsOf(c, f), 1)[0], ok: true, card: c }));
      const falses = [];
      for (const f of shuffle(filled)) {
        if (falses.length >= 6 - trues.length || falses.length >= 3) break;
        const cand = shuffle(P.filter(o => o !== c).flatMap(o => itemsOf(o, f))).find(it => !hasItem(c, f, it) && !falses.some(x => x.field === f && norm(x.text) === norm(it)) && !trues.some(t => norm(t.text) === norm(it)));
        if (cand) falses.push({ field: f, text: cand, ok: false, card: c });
      }
      if (!falses.length) continue;
      qs.push({ kind: "about", card: c, prompt: `Select everything true of`, title: c.name, options: shuffle([...trues, ...falses]) });
    } else {
      // "Which ones have <field>: <item>?"
      const f = fields[Math.floor(Math.random() * fields.length)]; if (!f) continue;
      const all = shuffle(P.flatMap(c => itemsOf(c, f)));
      const item = all[0]; if (!item) continue;
      const yes = P.filter(c => hasItem(c, f, item)), no = P.filter(c => itemsOf(c, f).length && !hasItem(c, f, item));
      if (!no.length) continue;
      const opts = shuffle([...pick(yes, Math.min(yes.length, 4)), ...pick(no, Math.max(2, 6 - Math.min(yes.length, 4)))]).slice(0, 6);
      if (!opts.some(c => hasItem(c, f, item))) continue;
      qs.push({ kind: "which", field: f, item, prompt: `Which have ${f.toLowerCase()}:`, title: item, options: opts.map(c => ({ field: f, text: c.name, ok: hasItem(c, f, item), card: c })) });
    }
    const last = qs[qs.length - 1]; if (last && qs.slice(0, -1).some(q => q.title === last.title && q.prompt === last.prompt)) qs.pop();
  }
  return qs;
}
function startSATA(d) {

  if (!qs.length) { ST.stage.innerHTML = `<div class="results"><h2>Not enough to compare yet</h2><p class="muted">Select all needs at least two profile cards whose fields have different answers.</p><button class="btn" id="dn">Done</button></div>`; $("#dn").onclick = () => closeStudy(); return; }

      <div class="opts" id="opts">${q.options.map((o, k) => `<button class="opt" data-k="${k}" aria-pressed="false"><span class="k">${k + 1}</span><span>${q.kind === "about" ? `<span class="fl">${esc(o.field)}:</span>` : ""}${esc(o.text)}</span></button>`).join("")}</div>
      <div id="fb"><button class="btn primary" id="chk" style="width:100%;min-height:52px">Check answers</button></div>`;

  }

  };
  show();

      <div class="opts two" id="opts">${opts.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${k + 1}</span><span>${esc(o)}</span></button>`).join("")}</div><div id="fb"></div>`;
    $("#more") && ($("#more").onclick = () => { shown++; draw(); });
    $$("#opts .opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
  }
  function answer(k) {
    if (answered) return; answered = true;
    const c = rounds[i]; const ok = opts[k] === c.name; const worth = Math.max(1, 6 - shown);

    $("#opts").classList.add("locked");

    $("#fb").innerHTML = `<div class="feedback ${ok ? "ok" : "no"}"><div style="flex:1">${ok ? `Identified with ${plural(shown, "clue")}: +${worth}` : "It was " + esc(c.name)}<div class="det" style="margin-top:8px">${factsTable(c, d)}</div></div></div>
      <div class="row" style="margin-top:12px"><div class="spacer"></div><button class="btn primary" id="next">${i + 1 < rounds.length ? "Next unknown" : "See results"}</button></div>`;
    $("#next").onclick = () => { i++; show(); };

  }
  function finish() {

    ST.stage.innerHTML = `<div class="results">${ring(Math.round(pts / Math.max(1, max) * 100))}<h2>${pts} points</h2><p class="muted">${isBest ? "New personal best." : "Best: " + best + " points."} Fewer clues, more points.</p>
      <div class="row" style="justify-content:center"><button class="btn primary" id="again">Play again</button><button class="btn" id="dn">Done</button></div></div>`;
    $("#again").onclick = () => startUnknown(d); $("#dn").onclick = () => closeStudy();

  show();
}

/* ---------- Match ---------- */
function startMatch(d) {
  openStudy(d.name + ": match");
  const n = window.innerWidth >= 860 ? 6 : 5;
  const seenCards = new Set(), seenA = new Set(), seenQ = new Set(), pairs = [];
  for (const f of shuffle(factsOf(d))) {
    if (pairs.length >= n) break;
    if (!f.q || f.kind === "cloze") continue;
    const a = f.kind === "field" ? f.field + ": " + f.a : f.a;
    if (seenCards.has(f.card.id) || seenA.has(norm(a)) || seenQ.has(norm(f.q))) continue;
    if (f.kind === "field" && f.deck.cards.some(o => o !== f.card && norm((o.values || {})[f.field]) === norm(f.a))) continue; // shared values make ambiguous pairs
    seenCards.add(f.card.id); seenA.add(norm(a)); seenQ.add(norm(f.q)); pairs.push({ f, l: f.q, r: a });
  }
  if (pairs.length < 2) { ST.stage.innerHTML = `<div class="results"><h2>Need more cards</h2><button class="btn" id="dn">Done</button></div>`; $("#dn").onclick = () => closeStudy(); return; }
  const tiles = shuffle(pairs.flatMap((p, k) => [{ k, t: p.l }, { k, t: p.r }]));
  let first = null, left = pairs.length, penalty = 0; const t0 = Date.now();
  ST.right.innerHTML = `<span class="timer" id="tm">0.0</span>`;
  const tm = setInterval(() => { const el = $("#tm"); if (el) el.textContent = ((Date.now() - t0) / 1000 + penalty).toFixed(1); }, 100); ST.timers.push(tm);
  ST.stage.innerHTML = `<p class="muted" style="text-align:center">Tap matching pairs. A wrong pair adds a second.</p><div class="match-grid">${tiles.map((x, j) => `<button class="tile" data-j="${j}">${esc(x.t)}</button>`).join("")}</div>`;
  $$(".tile").forEach(b => b.onclick = () => {
    const j = +b.dataset.j; if (b.classList.contains("done")) return;
    if (first === null) { first = j; b.classList.add("sel"); return; }
    if (first === j) { b.classList.remove("sel"); first = null; return; }
    const a = $(`.tile[data-j="${first}"]`);
    if (tiles[first].k === tiles[j].k) { a.classList.remove("sel"); a.classList.add("done"); b.classList.add("done"); left--; setProg(1 - left / pairs.length); if (!left) done(); }
    else { penalty += 1; a.classList.remove("sel"); [a, b].forEach(x => { x.classList.add("bad"); setTimeout(() => x.classList.remove("bad"), 350); }); recordQuiz(pairs[tiles[first].k].f, false); }
    first = null;
  });
  function done() {
    clearInterval(tm);
    const time = +((Date.now() - t0) / 1000 + penalty).toFixed(1);
    const best = S.meta.best["m-" + d.id]; const isBest = !best || time < best; if (isBest) { S.meta.best["m-" + d.id] = time; saveMeta(); }
    setTimeout(() => {
      ST.stage.innerHTML = `<div class="results"><div class="timer" style="font-size:3rem">${time}s</div><h2>${isBest ? "New best time" : "Matched"}</h2><p class="muted">${isBest ? "" : "Best: " + best + "s. "}${penalty ? plural(penalty, "wrong pair") + " added." : "No wrong pairs."}</p>
        <div class="row" style="justify-content:center"><button class="btn primary" id="again">Play again</button><button class="btn" id="dn">Done</button></div></div>`;
      $("#again").onclick = () => startMatch(d); $("#dn").onclick = () => closeStudy();
    }, 300);
  }
  ST.onKey = e => { if (e.key === "Enter") $("#again")?.click(); };
}

/* ---------- Type it ---------- */
function startType(d) {
  openStudy(d.name + ": type it");
  const qs = shuffle(factsOf(d)).slice(0, 20);
  let i = 0, score = 0, state = "ask"; const missed = [];
  function show() {

    const im = f.kind === "basic" && f.card.img && f.card.imgSide !== "back" ? pic(f.card.img, "qimg") : "";
    ST.stage.innerHTML = `<div class="qcard"><div class="kicker">${f.kind === "field" ? esc(f.field) : f.kind === "cloze" ? "Fill in the blank" : f.q ? "Answer for" : "What is shown?"}</div>${im}${f.kind === "cloze" ? `<div class="qtext cloze">${clozeRender(f.card.text, f.idx, "q")}</div>` : f.q ? `<div class="qtext">${esc(f.q)}</div>` : ""}</div>
      <div class="typed"><input class="input" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer" aria-label="Your answer"><button class="btn primary" id="go">Check</button></div>
      <div class="row"><button class="btn ghost sm" id="idk">I don’t know</button></div><div id="fb"></div>`;
    const inp = $("#ans"); setTimeout(() => inp.focus(), 50);

  }
  function check(skip) {

    recordQuiz(f, ok);
    $("#ans").disabled = true; $("#go").remove(); $("#idk").remove();
    $("#fb").innerHTML = `<div class="feedback ${ok ? "ok" : "no"}"><div style="flex:1">${ok ? "Correct" : skip ? "Answer" : "Not quite"}<span class="det">${esc(f.a)}</span>${f.kind === "field" && splitItems(f.a).length > 1 ? `<span class="det small muted">Any one listed item counts. Try to recall them all.</span>` : ""}</div></div>
      <div class="row" style="margin-top:12px">${!ok && !skip && val.trim() ? `<button class="btn sm" id="override">I was right</button>` : ""}<div class="spacer"></div><button class="btn primary" id="next">${i + 1 < qs.length ? "Next" : "See results"}</button></div>`;
    $("#override") && ($("#override").onclick = () => { score++; missed.pop(); recordQuiz(f, true); const st = stOf(f); if (st) { st.w = Math.max(0, (st.w || 1) - 1); saveSrs(d.id); } i++; show(); });
    $("#next").onclick = () => { i++; show(); };
    setTimeout(() => $("#next")?.focus(), 30);
  }
  function finish() {
    setProg(1); ST.right.innerHTML = "";
    ST.stage.innerHTML = `<div class="results">${ring(Math.round(score / qs.length * 100))}<h2>${score} of ${qs.length} recalled</h2>
      <div class="row" style="justify-content:center"><button class="btn primary" id="again">Go again</button><button class="btn" id="dn">Done</button></div>
      ${missed.length ? `<div class="missed-list"><h3 style="margin-top:12px">Review these</h3>${missed.map(f => `<div class="card-row"><div><b>${esc(f.q || "Image card")}</b>${f.kind === "field" ? ` <span class="chip">${esc(f.field)}</span>` : ""}<div class="a" style="margin-top:4px">${esc(f.a)}</div></div></div>`).join("")}</div>` : ""}</div>`;
    $("#again").onclick = () => startType(d); $("#dn").onclick = () => closeStudy();
  }
  ST.onKey = e => { if (e.key === "Enter") { e.preventDefault(); if (state === "ask") check(false); else $("#next")?.click(); } };
  show();

/* ---------- Put in order (e.g. order of draw) ---------- */
function swatchFor(name) {
  const n = norm(name);
  const map = [["light blue", "lightblue"], ["royal", "royal"], ["lavender", "lavender"], ["purple", "lavender"], ["gold", "gold"], ["sst", "gold"], ["green", "green"], ["gray", "gray"], ["grey", "gray"], ["pink", "pink"], ["red", "red"], ["yellow", "yellow"], ["culture", "yellow"], ["orange", "orange"]];
  for (const [k, c] of map) if (n.includes(k)) return CAPS[c];
  return "";
}
function startSeq(d) {
  openStudy(d.name + ": put in order");
  const F = d.orderField;
  const items = d.cards.filter(c => c.type === "profile" && !isNaN(parseFloat((c.values || {})[F]))).map(c => ({ c, v: parseFloat(c.values[F]) }));
  let pool = shuffle(items), picked = [], checked = false;
  function draw() {
    const sw = it => { const s = swatchFor(it.c.name); return s ? `<span class="sw" style="--c:${s}"></span>` : ""; };
    ST.stage.innerHTML = `<div class="qcard"><div class="kicker">${esc(F)}</div><div class="qtext">Tap each item in order, first to last</div><p class="small muted" style="margin-top:6px">Tap a placed item to send it back.</p></div>
      ${picked.length ? `<div class="seq-picked">${picked.map((it, k) => `<button class="seq-item ${checked ? (it.v === sorted[k].v ? "right" : "wrong") : ""}" data-p="${k}"><span class="n">${k + 1}</span>${sw(it)}<span style="flex:1">${esc(it.c.name)}</span>${checked && it.v !== sorted[k].v ? `<span class="small" style="color:var(--bad)">${esc(F)}: ${esc(it.c.values[F])}</span>` : ""}</button>`).join("")}</div>` : ""}
      ${pool.length ? `<div class="seq-pool">${pool.map((it, k) => `<button class="seq-item" data-q="${k}" style="font-weight:500">${sw(it)}<span>${esc(it.c.name)}</span></button>`).join("")}</div>` : ""}
      <div id="fb"></div>`;
    if (!checked) {
      $$("[data-q]").forEach(b => b.onclick = () => { picked.push(pool.splice(+b.dataset.q, 1)[0]); draw(); });
      $$("[data-p]").forEach(b => b.onclick = () => { pool.push(picked.splice(+b.dataset.p, 1)[0]); draw(); });
    }
    if (!pool.length && !checked) $("#fb").innerHTML = `<button class="btn primary" id="chk" style="width:100%;min-height:52px">Check order</button>`;
    $("#chk") && ($("#chk").onclick = check);
    if (checked) {
      const right = picked.filter((it, k) => it.v === sorted[k].v).length;
      $("#fb").innerHTML = `<div class="feedback ${right === picked.length ? "ok" : "no"}"><div style="flex:1">${right === picked.length ? "Perfect order" : `${right} of ${picked.length} in the right spot`}<span class="det">Correct order: ${sorted.map(it => esc(it.c.name)).join(" → ")}</span><span class="det small muted">Items with the same ${esc(F.toLowerCase())} number are interchangeable.</span></div></div>
        <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn" id="dn">Done</button><button class="btn primary" id="again">Try again</button></div>`;
      $("#again").onclick = () => startSeq(d); $("#dn").onclick = () => closeStudy();
    }
    setProg(picked.length / items.length);
  }
  const sorted = items.slice().sort((a, b) => a.v - b.v);
  function check() {
    checked = true;
    picked.forEach((it, k) => recordQuiz({ deck: d, key: it.c.id + "::" + F }, it.v === sorted[k].v));
    draw();
  }
  ST.onKey = e => { if (e.key === "Enter") { e.preventDefault(); checked ? $("#again")?.click() : $("#chk")?.click(); } };
  draw();
}

/* ---------- Picture ID ---------- */
function startPicture(d) {
  openStudy(d.name + ": picture ID");

  const labels = cards.map(cardLabel);
  const rounds = shuffle(cards).slice(0, 15);
  let i = 0, score = 0, answered = false, opts = []; const missed = [];
  function show() {
    if (i >= rounds.length) return finish();
    const c = rounds[i]; answered = false;
    opts = shuffle([cardLabel(c), ...distinctOthers(labels, cardLabel(c), 3)]);
    ST.stage.innerHTML = `<div class="qcard"><div class="kicker">What is this?</div>${pic(c.img, "qimg big")}</div>
      <div class="opts ${opts.every(o => o.length < 40) ? "two" : ""}" id="opts">${opts.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${k + 1}</span><span>${esc(o)}</span></button>`).join("")}</div><div id="fb"></div>`;
    $$("#opts .opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
    setProg(i / rounds.length); ST.right.innerHTML = `<span class="small muted">${i + 1} of ${rounds.length}</span>`;
  }
  function answer(k) {
    if (answered) return; answered = true;
    const c = rounds[i], right = cardLabel(c), ok = opts[k] === right;

    const f = factsOf(d).find(x => x.card === c); if (f) recordQuiz(f, ok);
    $("#opts").classList.add("locked");
    $$("#opts .opt").forEach((b, j) => { if (opts[j] === right) b.classList.add("right"); else if (j === k) b.classList.add("wrong"); });
    const ctx = c.type === "profile" ? factsTable(c, d) : `<span class="det">${esc(c.back)}</span>`;
    $("#fb").innerHTML = `<div class="feedback ${ok ? "ok" : "no"}"><div style="flex:1">${ok ? "Correct" : "It’s " + esc(right)}<div class="det" style="margin-top:6px">${ctx}</div>${c.note ? `<span class="det small">${esc(c.note)}</span>` : ""}</div></div>
      <div class="row" style="margin-top:12px"><div class="spacer"></div><button class="btn primary" id="next">${i + 1 < rounds.length ? "Next" : "See results"}</button></div>`;
    $("#next").onclick = () => { i++; show(); };
  }
  function finish() {
    setProg(1); ST.right.innerHTML = "";
    ST.stage.innerHTML = `<div class="results">${ring(Math.round(score / rounds.length * 100))}<h2>${score} of ${rounds.length} identified</h2>
      <div class="row" style="justify-content:center">${missed.length ? `<button class="btn primary" id="rv">Review misses</button>` : ""}<button class="btn" id="again">Play again</button><button class="btn" id="dn">Done</button></div></div>`;
    $("#rv") && ($("#rv").onclick = () => startFlash(d, missed));
    $("#again").onclick = () => startPicture(d); $("#dn").onclick = () => closeStudy();
  }
  ST.onKey = e => {
    if (!answered && /^[1-4]$/.test(e.key)) answer(+e.key - 1);
    else if (answered && e.key === "Enter") $("#next")?.click();
  };
  show();
}

/* ---------- Board practice: timed mixed exam, results by content area ---------- */
function startBoard() {
  const decks = Object.values(S.decks).filter(d => factsOf(d).length >= 2);
  openStudy("Board practice");
  if (!decks.length) { ST.stage.innerHTML = `<div class="results"><h2>Add some decks first</h2><button class="btn" id="dn">Done</button></div>`; $("#dn").onclick = () => closeStudy(); return; }
  let n = 50, mins = 75, chosen = new Set(decks.map(d => d.id)), weighted = true;
  function setup() {
    ST.stage.innerHTML = `<div class="qcard"><h2 style="margin-bottom:6px">Set up your practice exam</h2><p class="muted small">Mixed questions from the decks you pick, a countdown timer, and no feedback until you submit, like a certification exam. Modeled on the style of the ASCP BOC, not real exam content.</p></div>
      <div><p class="lbl" style="margin-bottom:8px">Content areas</p><div class="checks">${decks.map(d => `<label class="check"><input type="checkbox" value="${d.id}" ${chosen.has(d.id) ? "checked" : ""}><span class="dot" style="background:${capOf(d)}"></span>${esc(d.name)}<span class="muted small" style="margin-left:auto">${factsOf(d).length}</span></label>`).join("")}</div></div>
      <div class="row" style="gap:24px">
        <div><p class="lbl" style="margin-bottom:6px">Questions</p><div class="seg" id="qn">${[25, 50, 100].map(x => `<button data-v="${x}" class="${n === x ? "on" : ""}">${x}</button>`).join("")}</div></div>
        <div><p class="lbl" style="margin-bottom:6px">Time</p><div class="seg" id="qt">${[["0", "Untimed"], ["1.5", "1.5 min each"], ["1", "1 min each"]].map(([v, l]) => `<button data-v="${v}" class="${String(mins / n) === v || (v === "0" && !mins) ? "on" : ""}">${l}</button>`).join("")}</div></div>
      </div>
      <label class="check" style="align-self:flex-start"><input type="checkbox" id="wt" ${weighted ? "checked" : ""}>Lean toward facts I miss or haven’t learned</label>
      <button class="btn primary" id="go" style="min-height:52px">${icon("exam")}Start exam</button>`;
    $$(".checks input").forEach(c => c.onchange = () => c.checked ? chosen.add(c.value) : chosen.delete(c.value));
    $$("#qn button").forEach(b => b.onclick = () => { const per = n ? mins / n : 0; n = +b.dataset.v; mins = per * n; setup(); });
    $$("#qt button").forEach(b => b.onclick = () => { mins = +b.dataset.v * n; setup(); });
    $("#wt").onchange = e => weighted = e.target.checked;
    $("#go").onclick = () => { if (!chosen.size) { toast("Pick at least one deck"); return; } run(); };
  }
  function build() {
    const facts = decks.filter(d => chosen.has(d.id)).flatMap(factsOf);
    const weightOf = f => { if (!weighted) return 1; const st = stOf(f); if (!st) return 2; return 1 + Math.min(4, (st.w || 0) * 1.5) + (st.i < 7 ? 1 : 0); };
    // weighted sampling without replacement
    const pool = facts.map(f => ({ f, k: Math.pow(Math.random(), 1 / weightOf(f)) })).sort((a, b) => b.k - a.k).map(x => x.f);
    const qs = [];
    for (const f of pool) { if (qs.length >= n) break; const q = questionFor(f); if (q) qs.push(q); }
    return qs;
  }
  function run() {
    const qs = build(); if (!qs.length) { toast("Not enough variety in those decks yet"); return; }
    const ans = new Array(qs.length).fill(-1), flags = new Set(); let i = 0, done = false;
    const end = mins ? Date.now() + mins * 60000 : 0; const t0 = Date.now();
    ST.confirmExit = () => done || confirm("Leave the exam? Your answers won’t be scored.");
    if (end) { const t = setInterval(() => { const left = end - Date.now(); const el = $("#clock"); if (el) { el.textContent = fmtClock(left); el.classList.toggle("low", left < 5 * 60000); } if (left <= 0) { clearInterval(t); submit(true); } }, 1000); ST.timers.push(t); }
    function fmtClock(ms) { ms = Math.max(0, ms); const m = Math.floor(ms / 60000), s = Math.floor(ms % 60000 / 1000); return m + ":" + String(s).padStart(2, "0"); }
    function show() {
      const q = qs[i];
      ST.right.innerHTML = `${end ? `<span class="timer clock" id="clock">${fmtClock(end - Date.now())}</span>` : ""}<button class="btn sm" id="nav">${i + 1}/${qs.length}</button>`;
      $("#nav").onclick = navigator_;
      ST.stage.innerHTML = `${questionHtml({ ...q, kicker: q.f.deck.name + (q.kicker && q.f.kind === "field" && !q.identify ? " · " + q.kicker : "") })}
        <div class="opts" id="opts">${q.options.map((o, k) => `<button class="opt ${ans[i] === k ? "sel" : ""}" data-k="${k}"><span class="k">${String.fromCharCode(65 + k)}</span><span>${esc(o)}</span></button>`).join("")}</div>
        <div class="row"><button class="btn icon" id="pv" ${i ? "" : "disabled"} aria-label="Previous">${icon("left")}</button><button class="btn ${flags.has(i) ? "flagged" : ""}" id="fl">${icon("flag")}${flags.has(i) ? "Flagged" : "Flag"}</button><div class="spacer"></div>
        ${i + 1 < qs.length ? `<button class="btn primary" id="nx">Next${icon("right")}</button>` : `<button class="btn primary" id="sub">Review and submit</button>`}</div>`;
      $$("#opts .opt").forEach(b => b.onclick = () => { ans[i] = +b.dataset.k; $$("#opts .opt").forEach(x => x.classList.toggle("sel", x === b)); });
      $("#pv").onclick = () => { i--; show(); };
      $("#fl").onclick = () => { flags.has(i) ? flags.delete(i) : flags.add(i); show(); };
      $("#nx") && ($("#nx").onclick = () => { i++; show(); });
      $("#sub") && ($("#sub").onclick = navigator_);
      setProg(ans.filter(a => a >= 0).length / qs.length);
    }
    function navigator_() {
      const blank = ans.filter(a => a < 0).length;
      modal(`${mhead("Questions")}<div class="navgrid">${qs.map((_, k) => `<button class="${ans[k] >= 0 ? "done" : ""} ${flags.has(k) ? "flag" : ""} ${k === i ? "cur" : ""}" data-k="${k}">${k + 1}</button>`).join("")}</div>
        <div class="legend" style="margin-top:12px"><span><i style="background:var(--violet)"></i>Answered</span><span><i style="background:var(--warn)"></i>Flagged</span><span><i style="background:var(--surface-2);border:1px solid var(--line)"></i>Unanswered</span></div>
        <div class="modal-foot"><span class="small muted" style="margin-right:auto;align-self:center">${blank ? plural(blank, "question") + " unanswered" : "All answered"}</span><button class="btn" data-close>Keep going</button><button class="btn primary" id="sb">Submit exam</button></div>`,
        (s, close) => { $$(".navgrid button", s).forEach(b => b.onclick = () => { i = +b.dataset.k; close(); show(); }); $("#sb", s).onclick = () => { close(); submit(false); }; });
    }
    function submit(timeUp) {
      if (done) return; done = true; ST.timers.forEach(clearInterval);
      let right = 0; const byDeck = {};
      qs.forEach((q, k) => { const ok = q.options[ans[k]] === q.answer; if (ok) right++; const id = q.f.deck.id; byDeck[id] = byDeck[id] || [0, 0]; byDeck[id][1]++; if (ok) byDeck[id][0]++; if (!q.identify) recordQuiz(q.f, ok); });
      const pct = Math.round(right / qs.length * 100); const took = Math.round((Date.now() - t0) / 60000);
      ST.right.innerHTML = ""; setProg(1);
      ST.stage.innerHTML = `<div class="results">${ring(pct)}<h2>${right} of ${qs.length} correct</h2><p class="muted">${timeUp ? "Time ran out. " : ""}Finished in ${plural(took, "minute")}. Every miss is scheduled for review today.</p></div>
        <div class="panel"><h3 style="margin-bottom:8px">By content area</h3>${Object.entries(byDeck).map(([id, [r, t]]) => `<div class="deckbar"><span style="font-weight:600">${esc(S.decks[id]?.name || "")}</span><div class="mastery"><i class="m" style="width:${r / t * 100}%;background:${r / t >= .7 ? "var(--good)" : r / t >= .5 ? "var(--warn)" : "var(--bad)"}"></i></div><span class="small muted">${r}/${t}</span></div>`).join("")}</div>
        <div class="row" style="justify-content:center"><button class="btn primary" id="rev">Review answers</button><button class="btn" id="again">New exam</button><button class="btn" id="dn">Done</button></div>
        <div id="review" class="missed-list"></div>`;
      $("#again").onclick = () => startBoard(); $("#dn").onclick = () => closeStudy();
      $("#rev").onclick = () => {
        $("#rev").remove();
        $("#review").innerHTML = qs.map((q, k) => { const ok = q.options[ans[k]] === q.answer; return `<div class="card-row" style="border-color:${ok ? "var(--good)" : "var(--bad)"}"><div><span class="small muted">${k + 1}. ${esc(q.f.deck.name)}</span><div><b>${esc(qLabel(q))}</b>${q.f.kind === "field" && !q.identify ? ` <span class="chip">${esc(q.kicker)}</span>` : ""}</div><div class="a" style="margin-top:4px">${ok ? "✓ " : (ans[k] >= 0 ? "Your answer: " + esc(q.options[ans[k]]) + ". " : "Unanswered. ") + "Correct: "}${esc(q.answer)}</div></div></div>`; }).join("");
      };
    }
    ST.onKey = e => {
      if (done) return;
      const k = "abcd".indexOf(e.key.toLowerCase()); const num = /^[1-4]$/.test(e.key) ? +e.key - 1 : k;
      if (num >= 0 && num < qs[i].options.length) $(`#opts .opt[data-k="${num}"]`)?.click();
      else if (e.key === "ArrowRight" || e.key === "Enter") ($("#nx") || $("#sub"))?.click();
      else if (e.key === "ArrowLeft") $("#pv")?.click();
      else if (e.key === "f" || e.key === "F") $("#fl")?.click();
    };
    show();
  }
  setup();
}

/* ---------- boot ---------- */
async function boot() {
  render();
  await IDB.open();
  const docs = await Store.loadAll();
  applyDocs(docs);
  // copy anything that only existed in localStorage into IndexedDB
  for (const [k, v] of Object.entries(docs)) IDB.put(k, v);
  tagLegacyPacks();
  S.ready = true; render();
  if (navigator.storage && navigator.storage.persist) { try { if (!(await navigator.storage.persisted())) await navigator.storage.persist(); } catch { } }
  if (Sync.on()) Sync.now();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("./sw.js").catch(() => { });
}
boot();
</script></body></html>
