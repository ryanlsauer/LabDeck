<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B3FD1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LabDeck">
<title>LabDeck</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#F7F8FB; --ink:#1C1830; --ink-2:#4A4560; --ink-3:#7C7892;
  --line:#E3E5EE; --line-2:#D3D6E2;
  --violet:#5B3FD1; --violet-ink:#FFFFFF; --violet-soft:#ECE8FC; --violet-deep:#3F2AA0;
  --safranin:#D93D72; --safranin-soft:#FCE6EE;
  --good:#16896A; --good-soft:#DDF3EC; --warn:#B7790F; --warn-soft:#FBF0DA; --bad:#C8333F; --bad-soft:#FBE3E5;
  --shadow:0 1px 2px rgba(28,24,48,.06),0 8px 24px -12px rgba(28,24,48,.18);
  --radius-lg:20px; --radius:14px; --radius-sm:10px;
  --font-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13111C; --surface:#1D1A29; --surface-2:#252134; --ink:#EEEBF8; --ink-2:#C2BDD6; --ink-3:#8F89A8;
    --line:#2E2A40; --line-2:#3A3550;
    --violet:#8B74F2; --violet-ink:#120E22; --violet-soft:#2A2350; --violet-deep:#B3A4FF;
    --safranin:#F2709B; --safranin-soft:#3A1E2B;
    --good:#3CC79D; --good-soft:#163329; --warn:#E8B048; --warn-soft:#352A14; --bad:#F06A74; --bad-soft:#3A1C20;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13111C; --surface:#1D1A29; --surface-2:#252134; --ink:#EEEBF8; --ink-2:#C2BDD6; --ink-3:#8F89A8;
  --line:#2E2A40; --line-2:#3A3550;
  --violet:#8B74F2; --violet-ink:#120E22; --violet-soft:#2A2350; --violet-deep:#B3A4FF;
  --safranin:#F2709B; --safranin-soft:#3A1E2B;
  --good:#3CC79D; --good-soft:#163329; --warn:#E8B048; --warn-soft:#352A14; --bad:#F06A74; --bad-soft:#3A1C20;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--violet);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.75rem,4vw,2.4rem);font-weight:700}
h2{font-size:1.35rem;font-weight:650}
h3{font-size:1.05rem;font-weight:650}
p{margin:0}
.muted{color:var(--ink-3)}
.small{font-size:.875rem}
.hidden{display:none!important}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Shell */
.shell{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding:20px 16px 110px}
.wrap{max-width:980px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:1.2rem}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--violet);position:relative;overflow:hidden}
.brand-mark::after{content:"";position:absolute;inset:0 0 0 55%;background:var(--safranin)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font-size:.72rem;color:var(--ink-3);text-decoration:none;border-radius:10px}
.tabbar a.on{color:var(--violet)}
@media (min-width:900px){
  .tabbar{display:none}
  .side{display:flex;flex-direction:column;gap:6px;width:250px;flex:none;position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--line);background:var(--surface)}
  .side .brand{padding:4px 10px 18px}
  .side a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-weight:600}
  .side a:hover{background:var(--surface-2)}
  .side a.on{background:var(--violet-soft);color:var(--violet-deep)}
  .side .sidedecks{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);overflow:auto;display:flex;flex-direction:column;gap:2px}
  .side .sidedecks a{font-weight:500;font-size:.92rem;padding:8px 12px}
  .side .sync{margin-top:auto;font-size:.8rem;color:var(--ink-3);padding:0 12px;display:flex;gap:8px;align-items:center}
  .main{padding:36px 40px 60px}
  .topbar .brand{display:none}
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.ok{background:var(--good)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:600;min-height:44px;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--violet);border-color:var(--violet);color:var(--violet-ink)}
.btn.primary:hover{background:var(--violet-deep);border-color:var(--violet-deep)}
:root[data-theme="dark"] .btn.primary:hover{color:#120E22}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem;border-radius:10px}
.btn.icon{padding:0;width:44px}
.btn.icon.sm{width:36px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* Today panel */
.today{display:grid;gap:16px;grid-template-columns:1fr;margin-bottom:34px}
@media (min-width:700px){.today{grid-template-columns:1.6fr 1fr}}
.due-panel{background:#5B3FD1;color:#fff;border-radius:var(--radius-lg);padding:24px;position:relative;overflow:hidden;min-height:200px;display:flex;flex-direction:column}
.due-panel::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(255,255,255,.18),rgba(255,255,255,0) 60%)}
.due-panel .cells{position:absolute;right:18px;bottom:16px;display:grid;grid-template-columns:repeat(6,10px);gap:6px;opacity:.5}
.due-panel .cells i{width:10px;height:10px;border-radius:50%;background:#fff;opacity:.25}
.due-panel .cells i.p{background:var(--safranin);opacity:1}
.due-panel .big{font-family:var(--font-display);font-size:3.4rem;font-weight:700;line-height:1;margin:6px 0 4px;letter-spacing:-.03em}
.due-panel p{color:rgba(255,255,255,.85)}
.due-panel .btn{margin-top:auto;align-self:flex-start;background:#fff;color:#2A1A86;border-color:#fff}
.due-panel .btn:hover{background:#F0ECFF}
:root[data-theme="dark"] .due-panel, :root:not([data-theme="light"]) .due-panel{color:#fff}
.side-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.stat .n{font-family:var(--font-display);font-size:1.9rem;font-weight:700;line-height:1.1}
.stat .l{font-size:.85rem;color:var(--ink-3)}
.stat.wide{grid-column:1/-1;display:flex;align-items:center;gap:12px}

/* Decks as slides */
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 14px}
.decks{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.slide{position:relative;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-decoration:none;color:inherit;min-height:132px;box-shadow:var(--shadow)}
.slide:hover{border-color:var(--line-2)}
.slide .label{width:46px;flex:none;background:var(--cap);position:relative;display:flex;align-items:center;justify-content:center}
.slide .label::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 2px,transparent 2px 7px)}
.slide .label span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.7rem;font-weight:700;color:rgba(0,0,0,.55);position:relative;letter-spacing:.04em;max-height:110px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.slide .body{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.slide .body h3{overflow:hidden;text-overflow:ellipsis}
.slide .meta{font-size:.85rem;color:var(--ink-3)}
.slide .due{font-size:.8rem;font-weight:700;color:var(--safranin);background:var(--safranin-soft);padding:2px 8px;border-radius:999px;align-self:flex-start}
.mastery{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex;margin-top:auto}
.mastery i{display:block;height:100%}
.mastery .m{background:var(--good)} .mastery .g{background:var(--violet);opacity:.55}
.slide.new{border-style:dashed;align-items:center;justify-content:center;gap:10px;color:var(--ink-2);font-weight:600;background:transparent;box-shadow:none;cursor:pointer}

/* Deck page */
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);text-decoration:none;font-weight:600;font-size:.92rem;margin-bottom:10px}
.deck-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:22px}
.cap{width:38px;height:46px;border-radius:9px 9px 6px 6px;background:var(--cap);flex:none;position:relative;box-shadow:inset 0 -10px 0 rgba(0,0,0,.12)}
.cap::after{content:"";position:absolute;left:6px;right:6px;top:7px;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
.modes{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:30px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);text-align:left;min-height:104px}
.mode:hover{border-color:var(--violet)}
.mode .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--violet-soft);color:var(--violet-deep)}
.mode.alt .ic{background:var(--safranin-soft);color:var(--safranin)}
.mode b{font-weight:700}
.mode small{color:var(--ink-3);font-size:.8rem;line-height:1.3}
.mode[disabled]{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:0 12px;min-height:44px}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0}
.cards{display:flex;flex-direction:column;gap:8px}
.card-row{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.card-row .q{font-weight:700}
.card-row .a{color:var(--ink-2);white-space:pre-wrap}
.basic-grid{display:grid;gap:4px 18px}
@media (min-width:700px){.basic-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}}
.facts{display:grid;gap:4px 14px;grid-template-columns:minmax(90px,auto) 1fr;margin-top:8px;font-size:.92rem}
.facts dt{color:var(--ink-3)}
.facts dd{margin:0;white-space:pre-wrap}
.card-row .acts{display:flex;gap:2px}
.star.on{color:var(--warn)}
.star.on svg{fill:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.chip.v{background:var(--violet-soft);color:var(--violet-deep);border-color:transparent}
.empty{border:1.5px dashed var(--line-2);border-radius:var(--radius-lg);padding:34px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty p{max-width:46ch;color:var(--ink-2)}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(15,12,30,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@media (min-width:700px){.scrim{align-items:center;padding:24px}}
.modal{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);animation:rise .2s ease-out}
@media (min-width:700px){.modal{border-radius:22px;padding:26px}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.lbl{font-weight:700;font-size:.9rem}
.field .hint{font-size:.8rem;color:var(--ink-3)}
.input,textarea.input,select.input{width:100%;border:1px solid var(--line-2);background:var(--surface-2);border-radius:12px;padding:11px 13px;outline:0;min-height:46px}
.input:focus{border-color:var(--violet);background:var(--surface)}
textarea.input{resize:vertical;min-height:84px;line-height:1.45}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.caps{display:flex;gap:10px;flex-wrap:wrap}
.caps button{width:38px;height:44px;border:0;padding:0;border-radius:9px 9px 6px 6px;background:var(--c);position:relative;box-shadow:inset 0 -9px 0 rgba(0,0,0,.12)}
.caps button.on{outline:3px solid var(--ink);outline-offset:3px}
.fieldlist{display:flex;flex-direction:column;gap:8px}
.fieldlist .fl{display:flex;gap:8px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

/* Study overlay */
.study{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.study-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg)}
.study-top .t{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin:0 16px}
.prog i{display:block;height:100%;background:var(--violet);border-radius:999px;transition:width .3s}
.stage{flex:1;width:100%;max-width:760px;margin:0 auto;padding:20px 16px 28px;display:flex;flex-direction:column;gap:18px}

/* The glass slide flashcard */
.flip{perspective:1600px;cursor:pointer;user-select:none}
.flip-inner{position:relative;min-height:min(56vh,420px);transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.flip.on .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line-2);border-radius:22px;box-shadow:var(--shadow);display:flex;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.face .frost{width:52px;flex:none;background:var(--cap);position:relative;display:flex;align-items:center;justify-content:center}
.face .frost::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.24) 0 2px,transparent 2px 7px)}
.face .frost span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.72rem;font-weight:700;color:rgba(0,0,0,.55);position:relative;white-space:nowrap;max-height:85%;overflow:hidden;text-overflow:ellipsis}
.face .content{flex:1;padding:26px 24px;display:flex;flex-direction:column;justify-content:center;gap:12px;overflow:auto;min-width:0}
.face .kicker{font-size:.85rem;font-weight:700;color:var(--violet)}
.face .main-text{font-family:var(--font-display);font-size:clamp(1.4rem,4.5vw,2.1rem);font-weight:600;line-height:1.2;white-space:pre-wrap;overflow-wrap:anywhere}
.face .sub-text{font-size:clamp(1.05rem,3vw,1.25rem);white-space:pre-wrap;overflow-wrap:anywhere}
.face .note{font-size:.92rem;color:var(--ink-2);background:var(--surface-2);border-radius:12px;padding:10px 12px;white-space:pre-wrap}
.face .facts{font-size:.9rem}
.face .facts .hl{color:var(--violet-deep);font-weight:700}
.tap-hint{text-align:center;font-size:.85rem;color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){.flip-inner{transition:none}}

.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{border:1px solid var(--line-2);background:var(--surface);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;min-height:62px}
.grades button small{font-weight:500;color:var(--ink-3);font-size:.75rem}
.grades .g1{color:var(--bad)} .grades .g2{color:var(--warn)} .grades .g3{color:var(--good)} .grades .g4{color:var(--violet)}
.grades .g1:hover{background:var(--bad-soft)} .grades .g2:hover{background:var(--warn-soft)} .grades .g3:hover{background:var(--good-soft)} .grades .g4:hover{background:var(--violet-soft)}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow)}
.qcard .kicker{font-size:.85rem;font-weight:700;color:var(--violet);margin-bottom:6px}
.qcard .qtext{font-family:var(--font-display);font-size:clamp(1.25rem,4vw,1.7rem);font-weight:600;line-height:1.25;white-space:pre-wrap;overflow-wrap:anywhere}
.clues{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.clue{display:flex;gap:10px;padding:8px 12px;background:var(--surface-2);border-radius:10px;font-size:.98rem}
.clue b{color:var(--ink-3);font-weight:600;min-width:110px}
.opts{display:grid;gap:10px}
@media (min-width:640px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--surface);min-height:56px;font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere}
.opt:hover{border-color:var(--violet)}
.opt .k{width:26px;height:26px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;background:var(--surface-2);color:var(--ink-3)}
.opt.sel{border-color:var(--violet);background:var(--violet-soft)}
.opt.sel .k{background:var(--violet);color:var(--violet-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.missed{border-color:var(--good);border-style:dashed}
.opt .tag{font-size:.75rem;font-weight:700;margin-left:auto;flex:none}
.opt .fl{color:var(--ink-3);font-weight:700;margin-right:4px}
.opts.locked .opt{pointer-events:none}
.feedback{border-radius:14px;padding:14px 16px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.feedback.ok{background:var(--good-soft);color:var(--good)}

function modal(html, onMount) {
  const s = document.createElement("div"); s.className = "scrim";
  s.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(s);
  const close = () => { s.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  s.addEventListener("mousedown", e => { if (e.target === s) close(); });
  $$("[data-close]", s).forEach(b => b.onclick = close);
  onMount && onMount(s, close);
  if (window.matchMedia("(hover:hover)").matches) setTimeout(() => { const f = $("input:not([type=checkbox]):not([type=file]),textarea", s); f && f.focus(); }, 60);
  return close;
}
const mhead = t => `<div class="modal-head"><h2>${t}</h2><button class="btn ghost icon" data-close aria-label="Close">${icon("x")}</button></div>`;
function confirmModal(title, body, label, fn) {
  modal(`${mhead(esc(title))}<p class="muted">${esc(body)}</p><div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="ok">${esc(label)}</button></div>`,
    (s, close) => $("#ok", s).onclick = () => { close(); fn(); });

function fileToImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const im = new Image();
    im.onload = () => {
      const max = 1100; let w = im.naturalWidth, h = im.naturalHeight; const k = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * k); h = Math.round(h * k);
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); ctx.drawImage(im, 0, 0, w, h);
      URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg", 0.8));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad image")); };
    im.src = url;
  });
}

function parseCSV(text) {
  const delim = (text.split("\n")[0].match(/\t/g) || []).length ? "\t" : ",";
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(Boolean));
}
function parseList(text, sep) {
  const seps = { tab: "\t", dash: /\s[-–—]\s/, colon: ":", comma: "," };
  return text.split("\n").map(l => l.trim()).filter(Boolean).map(l => {
    const s = seps[sep]; let i, len;
    if (s instanceof RegExp) { const m = l.match(s); if (!m) return null; i = m.index; len = m[0].length; }
    else { i = l.indexOf(s); len = s.length; if (i < 0) return null; }
    return { front: l.slice(0, i).trim(), back: l.slice(i + len).trim() };
  }).filter(x => x && x.front && x.back);
}

      <span class="hint">Copied from Quizlet? Export with Tab between term and definition.</span></div>
      <p class="small muted" id="cnt">Paste to preview.</p>`
    : `
      <div class="field"><label for="itx">Paste rows from Excel, Sheets or a CSV</label><textarea class="input" id="itx" rows="8" placeholder="Name&#9;Gram stain&#9;Oxidase&#9;Lactose&#10;E. coli&#9;GNR&#9;Negative&#9;Fermenter"></textarea>

    const bind = () => {
      $$("[data-close]", s).forEach(b => b.onclick = close);

          const r = parseCSV($("#itx", s).value); if (r.length < 2) { toast("Need a header row and at least one row"); return; }
          r[0].slice(1).map(h => h.trim()).filter(Boolean).forEach(h => { if (!d.fields.includes(h)) d.fields.push(h); });
          added = r.slice(1).filter(row => row[0]).map(row => ({ id: uid(), type: "profile", name: row[0], values: Object.fromEntries(r[0].slice(1).map((h, i) => [h.trim(), row[i + 1] || ""]).filter(([h, v]) => h && v)), note: "", star: false }));
        }
        if (!added.length) { toast("Nothing to add yet"); return; }
        d.cards.push(...added); saveDeck(d); close(); renderDeck(d); toast(plural(added.length, "card") + " added");
      };
    };
    bind();
  });
}

/* ---------- sharing decks with study partners ---------- */
function deckPackage(d) {
  const images = {}; d.cards.forEach(c => { if (c.img && S.images[c.img]) images[c.img] = S.images[c.img]; });
  return { app: "labdeck-deck", v: 2, deck: { name: d.name, color: d.color, fields: d.fields, orderField: d.orderField, cards: d.cards.map(c => ({ ...c, star: false })) }, images };
}
function addSharedPackage(p) {
  if (!p || !p.deck || !Array.isArray(p.deck.cards)) throw new Error("bad");
  const idMap = {};
  for (const [id, url] of Object.entries(p.images || {})) { if (typeof url === "string" && url.startsWith("data:image/")) { const n = uid(); idMap[id] = n; saveImage(n, url); } }
  const d = normalizeDeck({ id: uid(), name: String(p.deck.name || "Shared deck"), color: p.deck.color, fields: (p.deck.fields || []).map(String), orderField: p.deck.orderField || "", created: Date.now(),
    cards: p.deck.cards.map(c => { const x = { ...c, id: uid(), star: false }; if (x.img) x.img = idMap[x.img] || ""; return x; }) });
  S.decks[d.id] = d; saveDeck(d);
  return d;
}
function download(name, text, type = "application/json") {
  const blob = new Blob([text], { type });
  const file = typeof File === "function" ? new File([blob], name, { type }) : null;
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  return file;
}
function shareModal(d) {
  const canLink = Sync.on();
  modal(`${mhead("Share “" + esc(d.name) + "”")}
    <p class="muted" style="margin-bottom:16px">Your partner gets the cards and images, not your progress. They can import it into their own LabDeck.</p>
    <div class="col" style="gap:10px">
      <button class="btn primary" id="mkLink" ${canLink ? "" : "disabled"}>${icon("share")}Create a share link</button>
      ${canLink ? "" : `<p class="small muted">Share links use your GitHub connection. Turn on sync in Settings to use them, or send a file instead.</p>`}
      <div id="linkOut"></div>
      <button class="btn" id="dlDeck">${icon("download")}Download deck file</button>
    </div>`, (s) => {
    $("#dlDeck", s).onclick = async () => {
      const name = d.name.replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").toLowerCase() + ".labdeck.json";
      const text = JSON.stringify(deckPackage(d));
      const file = new File([text], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] }) && /iPhone|iPad|Android/i.test(navigator.userAgent)) { try { await navigator.share({ files: [file], title: d.name }); return; } catch { } }
      download(name, text); toast("Deck file downloaded");
    };
    $("#mkLink", s).onclick = async () => {
      const b = $("#mkLink", s); b.disabled = true; b.innerHTML = `<span class="spin"></span>Creating link`;
      try {
        const g = await Sync.api("/gists", { method: "POST", body: JSON.stringify({ description: "LabDeck shared deck: " + d.name, public: false, files: { "labdeck-share.json": { content: JSON.stringify(deckPackage(d)) } } }) });
        const link = location.href.split("#")[0] + "#import-" + g.id;
        $("#linkOut", s).innerHTML = `<div class="linkbox"><input class="input" readonly value="${esc(link)}"><button class="btn" id="cpL">${icon("copy")}Copy</button></div>`;
        $("#cpL", s).onclick = async () => { try { await navigator.clipboard.writeText(link); toast("Link copied"); } catch { $(".linkbox input", s).select(); } };
        b.innerHTML = `${icon("share")}Link ready`;
      } catch { b.disabled = false; b.innerHTML = `${icon("share")}Try again`; toast("Couldn’t create the link. Check your connection."); }
    };
  });
}
async function importShared(id) {
  history.replaceState(null, "", location.pathname + location.search + "#home");
  if (!/^[a-f0-9]{8,40}$/i.test(id)) { toast("That share link looks incomplete"); return; }
  let pkg;
  try {
    const g = await Sync.api("/gists/" + id, {}, Sync.token || "");
    const f = g.files["labdeck-share.json"]; const txt = await Sync.readFile(f); pkg = JSON.parse(txt);
  } catch { toast("Couldn’t open that shared deck. Check the link and your connection."); return; }
  const n = pkg?.deck?.cards?.length || 0;
  modal(`${mhead("Add shared deck?")}<p><b>${esc(pkg?.deck?.name || "Shared deck")}</b></p><p class="muted">${plural(n, "card")}. It’ll be added as a new deck; nothing of yours changes.</p>

}

/* ---------- progress ---------- */
function renderStats() {
  const decks = Object.values(S.decks);
  const days = Array.from({ length: 14 }, (_, i) => dayKey(Date.now() - (13 - i) * DAY));
  const vals = days.map(k => S.meta.history[k] || 0);
  let c = 0, w = 0, mastered = 0, total = 0;
  decks.forEach(d => factsOf(d).forEach(f => { total++; const st = stOf(f); if (st) { c += st.c || 0; w += st.w || 0; if (st.i >= 21) mastered++; } }));
  const acc = c + w ? Math.round(c / (c + w) * 100) : 0;
  const allReviews = Object.values(S.meta.history).reduce((a, b) => a + b, 0);
  const fc = Array.from({ length: 7 }, () => 0);
  const start = new Date(); start.setHours(0, 0, 0, 0);
  decks.forEach(d => Object.values(S.srs[d.id] || {}).forEach(st => { if (!st.d) return; const k = Math.floor((st.d - start.getTime()) / DAY); if (k >= 0 && k < 7) fc[k]++; else if (k < 0) fc[0]++; }));
  const bars = (arr, labels, cls) => { const mx = Math.max(5, ...arr); const bw = 600 / arr.length; return `<svg class="chart" viewBox="0 0 600 170" role="img">${arr.map((v, i) => { const h = Math.round(v / mx * 120); return `<rect class="${cls}" x="${i * bw + 6}" y="${135 - h}" width="${bw - 12}" height="${Math.max(h, 2)}" rx="5" opacity="${v ? 1 : .25}"><title>${labels[i]}: ${v}</title></rect>${v ? `<text x="${i * bw + bw / 2}" y="${130 - h}" text-anchor="middle">${v}</text>` : ""}<text x="${i * bw + bw / 2}" y="155" text-anchor="middle">${labels[i]}</text>`; }).join("")}</svg>`; };
  const dl = days.map(k => new Date(k + "T12:00").toLocaleDateString(undefined, { weekday: "narrow" }));
  const fl = fc.map((_, i) => i === 0 ? "Today" : new Date(Date.now() + i * DAY).toLocaleDateString(undefined, { weekday: "short" }));
  // 20-week calendar
  const weeks = 20; const end = new Date(); end.setHours(12, 0, 0, 0);
  const startDay = new Date(end.getTime() - ((weeks - 1) * 7 + end.getDay()) * DAY);
  const goal = S.meta.settings.dailyGoal || 50;
  let heat = "";
  for (let wk = 0; wk < weeks; wk++) for (let dd = 0; dd < 7; dd++) {
    const t = startDay.getTime() + (wk * 7 + dd) * DAY; if (t > end.getTime()) continue;
    const n = S.meta.history[dayKey(t)] || 0; const lvl = n === 0 ? 0 : n < goal * 0.34 ? 1 : n < goal * 0.67 ? 2 : n < goal ? 3 : 4;
    heat += `<rect x="${wk * 15}" y="${dd * 15}" width="12" height="12" rx="3" class="h${lvl}"><title>${dayKey(t)}: ${n}</title></rect>`;
  }
  $("#view").innerHTML = `
    ${topbar()}
    <h1 style="margin-bottom:22px">Progress</h1>
    <div class="side-stats" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:16px">
      <div class="stat"><div class="n">${streak()}</div><div class="l">day streak</div></div>
      <div class="stat"><div class="n">${allReviews}</div><div class="l">total reviews</div></div>
      <div class="stat"><div class="n">${acc}%</div><div class="l">accuracy</div></div>
      <div class="stat"><div class="n">${mastered}<span class="muted" style="font-size:1rem">/${total}</span></div><div class="l">facts mastered</div></div>
    </div>
    <div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h3>Study calendar</h3><div class="legend"><span>Less</span>${[0, 1, 2, 3, 4].map(l => `<svg width="12" height="12"><rect width="12" height="12" rx="3" class="h${l}"/></svg>`).join("")}<span>Goal met</span></div></div>
      <div style="overflow-x:auto"><svg class="heat" viewBox="0 0 ${weeks * 15} 105" style="min-width:${weeks * 13}px">${heat}</svg></div></div>
    <div class="panel"><h3 style="margin-bottom:10px">Reviews, last 14 days</h3>${bars(vals, dl, "b")}</div>
    <div class="panel"><h3 style="margin-bottom:4px">Coming up</h3><p class="small muted" style="margin-bottom:10px">Facts scheduled to come back each day. Overdue facts count toward today.</p>${bars(fc, fl, "t")}</div>
    <div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3>By deck</h3><div class="legend"><span><i style="background:var(--good)"></i>Mastered (3+ weeks)</span><span><i style="background:var(--violet);opacity:.55"></i>Learning</span><span><i style="background:var(--surface-2);border:1px solid var(--line)"></i>New</span></div></div>
      ${decks.length ? decks.map(d => { const k = deckCounts(d); return `<div class="deckbar"><a href="#d-${d.id}" style="color:inherit;font-weight:600;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.name)}</a><div class="mastery"><i class="m" style="width:${k.total ? k.mastered / k.total * 100 : 0}%"></i><i class="g" style="width:${k.total ? k.learning / k.total * 100 : 0}%"></i></div><span class="small muted">${k.total ? Math.round(k.mastered / k.total * 100) : 0}%</span></div>`; }).join("") : `<p class="muted">No decks yet.</p>`}
    </div>`;
}

  ST.stage.innerHTML = `<div class="results"><h2>How many questions?</h2><p class="muted">Questions are built from your cards, with wrong answers pulled from similar cards. Misses come back in your review today.</p>
    <div class="row" style="justify-content:center">${[10, 20].filter(x => x < n).map(x => `<button class="btn" data-n="${x}">${x}</button>`).join("")}<button class="btn primary" data-n="${n}">All ${n}</button></div></div>`;
  $$("[data-n]").forEach(b => b.onclick = () => runMC(d, buildMC(d, +b.dataset.n)));
  ST.onKey = e => { if (e.key === "Enter") $("[data-n].primary")?.click(); };
}
function runMC(d, qs) {
  if (!qs.length) { ST.stage.innerHTML = `<div class="results"><h2>Not enough variety yet</h2><p class="muted">Add a few more cards with different answers so wrong options can be built.</p><button class="btn" id="dn">Done</button></div>`; $("#dn").onclick = () => closeStudy(); return; }
  let i = 0, score = 0, answered = false; const missed = [];
  function show() {
    if (i >= qs.length) return finish();
    const q = qs[i]; answered = false;
    ST.stage.innerHTML = `${questionHtml(q)}
      <div class="opts ${q.options.every(o => o.length < 40) ? "two" : ""}" id="opts">${q.options.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${k + 1}</span><span>${esc(o)}</span></button>`).join("")}</div><div id="fb"></div>`;
    $$("#opts .opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
    setProg(i / qs.length); ST.right.innerHTML = `<span class="small muted">${i + 1} of ${qs.length}</span>`;
  }
  function answer(k) {
    if (answered) return; answered = true;
    const q = qs[i]; const ok = q.options[k] === q.answer;
    if (ok) score++; else missed.push(q);
    if (!q.identify) recordQuiz(q.f, ok);
    $("#opts").classList.add("locked");
    $$("#opts .opt").forEach((b, j) => { if (q.options[j] === q.answer) b.classList.add("right"); else if (j === k) b.classList.add("wrong"); });
    const prof = q.f.kind === "field" || q.identify;
    const ctx = prof ? `<div class="det" style="margin-top:8px"><b>${esc(q.f.card.name)}</b>${factsTable(q.f.card, d, q.identify ? null : q.f.field)}</div>` : (q.f.card.note ? `<span class="det">${esc(q.f.card.note)}</span>` : "");
    $("#fb").innerHTML = `<div class="feedback ${ok ? "ok" : "no"}"><div style="flex:1">${ok ? "Correct" : "Not quite. Answer: " + esc(q.answer)}${ctx}</div></div>
      <div class="row" style="margin-top:12px"><div class="spacer"></div><button class="btn primary" id="next">${i + 1 < qs.length ? "Next" : "See results"}</button></div>`;
    $("#next").onclick = () => { i++; show(); };
  }
  function finish() {
    setProg(1); ST.right.innerHTML = "";
    const pct = Math.round(score / qs.length * 100);
    ST.stage.innerHTML = `<div class="results">${ring(pct)}<h2>${score} of ${qs.length} correct</h2>
      <div class="row" style="justify-content:center">${missed.length ? `<button class="btn primary" id="retry">Retry ${missed.length} missed</button>` : ""}<button class="btn" id="newq">New quiz</button><button class="btn" id="dn">Done</button></div>
      ${missed.length ? `<div class="missed-list"><h3 style="margin-top:12px">Review these</h3>${missed.map(q => `<div class="card-row"><div><b>${esc(qLabel(q))}</b>${q.f.kind === "field" && !q.identify ? ` <span class="chip">${esc(q.kicker)}</span>` : ""}<div class="a" style="margin-top:4px">${esc(q.answer)}</div></div></div>`).join("")}</div>` : ""}</div>`;
    $("#retry") && ($("#retry").onclick = () => runMC(d, shuffle(missed).map(q => ({ ...q, options: shuffle(q.options) }))));
    $("#newq").onclick = () => startMC(d); $("#dn").onclick = () => closeStudy();
  }
  ST.onKey = e => {
    if (!answered && /^[1-9]$/.test(e.key)) { const b = $(`#opts .opt[data-k="${+e.key - 1}"]`); b && b.click(); }
    else if (answered && (e.key === "Enter" || e.key === "ArrowRight")) $("#next")?.click();
  };
  show();
}

/* ---------- Compare profiles side by side ---------- */
function startCompare(d) {
  openStudy(d.name + ": compare");
  const P = d.cards.filter(c => c.type === "profile");
  let sel = P.slice(0, 2).map(c => c.id), diffOnly = false;
  function draw() {
    const cols = sel.map(id => P.find(c => c.id === id)).filter(Boolean);
    const rows = d.fields.map(f => {
      const vals = cols.map(c => (c.values || {})[f] || "");
      const differs = new Set(vals.map(norm)).size > 1;
      return { f, vals, differs };
    }).filter(r => r.vals.some(Boolean) && (!diffOnly || r.differs));
    ST.stage.style.maxWidth = "1000px";
    ST.stage.innerHTML = `
      <div><p class="lbl" style="margin-bottom:8px">Pick 2 to 4 to compare</p><div class="pickchips">${P.map(c => `<button class="chipbtn ${sel.includes(c.id) ? "on" : ""}" data-id="${c.id}">${esc(c.name)}</button>`).join("")}</div></div>
      <label class="check" style="align-self:flex-start"><input type="checkbox" id="diff" ${diffOnly ? "checked" : ""}>Only show differences</label>
      ${cols.length >= 2 ? `<div class="cmp-wrap"><table class="cmp"><thead><tr><th></th>${cols.map(c => `<th>${pic(c.img, "cmpimg")}${esc(c.name)}</th>`).join("")}</tr></thead>
        <tbody>${rows.map(r => `<tr class="${r.differs ? "diff" : ""}"><th>${esc(r.f)}</th>${r.vals.map(v => `<td>${esc(v) || `<span class="muted">—</span>`}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="${cols.length + 1}" class="muted">No differences in filled fields.</td></tr>`}</tbody></table></div>
        <p class="small muted">Highlighted rows are where they differ. Those are usually the tests that tell them apart.</p>` : `<p class="muted">Pick at least two.</p>`}`;
    $$(".chipbtn").forEach(b => b.onclick = () => { const id = b.dataset.id; if (sel.includes(id)) sel = sel.filter(x => x !== id); else { sel.push(id); if (sel.length > 4) sel.shift(); } draw(); });
    $("#diff").onchange = e => { diffOnly = e.target.checked; draw(); };
  }
  setProg(1); draw();
}

}

      setProg(i / order.length); ST.right.innerHTML = `<span class="small muted">${i + 1} of ${order.length}</span>`;
    }
    function check(skip) {
      if (state !== "ask") return;
      const q = order[i]; const raw = $("#ans").value.replace(/,/g, "").replace(/^1\s*:\s*/, "").trim();
      if (!skip && raw === "") { toast("Enter a number, or tap Show me how"); return; }
      state = "shown";
      const val = parseFloat(raw);
      const tol = Math.max(q.tol ?? 0.5 * 10 ** -q.dec, Math.abs(q.ans) * (q.tolPct ?? 1) / 100);
      const ok = !skip && isFinite(val) && Math.abs(val - q.ans) <= tol + 1e-9;
      if (ok) score++; else missed.push(q);
      bumpHistory(false);
      $("#ans").disabled = true; $("#go").remove(); $("#idk").remove();
      $("#fb").innerHTML = `<div class="feedback ${ok ? "ok" : "no"}"><div style="flex:1">${ok ? "Correct" : skip ? "Here’s how" : "Not quite"}: ${q.prefix || ""}${fmtN(q.ans, q.dec)} ${esc(q.unit)}
        <ol class="worked">${q.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>${q.note ? `<span class="det small">${esc(q.note)}</span>` : ""}</div></div>
        <div class="row" style="margin-top:12px"><div class="spacer"></div><button class="btn primary" id="next">${i + 1 < order.length ? "Next" : "See results"}</button></div>`;
      $("#next").onclick = () => { i++; show(); }; setTimeout(() => $("#next")?.focus(), 30);
    }
    function finish() {
      setProg(1); ST.right.innerHTML = "";
      ST.stage.innerHTML = `<div class="results">${ring(Math.round(score / order.length * 100))}<h2>${score} of ${order.length} correct</h2>
        <div class="row" style="justify-content:center"><button class="btn primary" id="again">New set</button><button class="btn" id="dn">Done</button></div>
        ${missed.length ? `<div class="missed-list"><h3 style="margin-top:12px">Formulas to review</h3>${[...new Set(missed.map(q => q.steps[0]))].map(s => `<div class="card-row"><div>${esc(s)}</div></div>`).join("")}</div>` : ""}</div>`;
      $("#again").onclick = run; $("#dn").onclick = () => closeStudy();
    }
    ST.onKey = e => { if (e.key === "Enter") { e.preventDefault(); state === "ask" ? check(false) : $("#next")?.click(); } };
    show();
  }
  setup();
}

/* ---------- Reference range drills (reads any deck with a "range" field, so you can edit values) ---------- */
function parseRange(v) { const m = String(v || "").match(/(-?\d+(?:\.\d+)?)\s*[–—-]\s*(\d+(?:\.\d+)?)/); if (!m) return null; const lo = parseFloat(m[1]), hi = parseFloat(m[2]); if (!(hi > lo)) return null; const dec = Math.max((m[1].split(".")[1] || "").length, (m[2].split(".")[1] || "").length); return { lo, hi, dec, text: m[1] + "–" + m[2] }; }
function rangeItems(deck) {
  const rf = deck.fields.find(f => /range/i.test(f)); if (!rf) return [];
  const uf = deck.fields.find(f => /^units?$/i.test(f));
  return deck.cards.filter(c => c.type === "profile").map(c => { const r = parseRange((c.values || {})[rf]); return r ? { deck, card: c, field: rf, unit: uf ? (c.values[uf] || "") : "", ...r } : null; }).filter(Boolean);
}
function startRanges() {
  openStudy("Reference range drills");
  const decks = Object.values(S.decks).filter(d => rangeItems(d).length);
  if (!decks.length) { noDataScreen("No reference ranges yet", "Add the reference range starter packs, or any profile deck with a field named like “Reference range” (written as 135–145).", `<button class="btn primary" id="pk">Open starter packs</button>`); $("#pk").onclick = () => { closeStudy(); packsModal(); }; return; }
  let chosen = new Set(decks.map(d => d.id));
  function setup() {
    ST.stage.innerHTML = `<div class="qcard"><h2 style="margin-bottom:6px">Reference range drills</h2><p class="muted small">Decide whether a result is high, low or normal, and recall the ranges themselves. Ranges come from your decks, so edit them to match your program.</p></div>
      <div class="checks">${decks.map(d => `<label class="check"><input type="checkbox" value="${d.id}" ${chosen.has(d.id) ? "checked" : ""}><span class="dot" style="background:${capOf(d)}"></span>${esc(d.name)}<span class="small muted" style="margin-left:auto">${rangeItems(d).length}</span></label>`).join("")}</div>
      <button class="btn primary" id="go" style="min-height:52px">Start 15 questions</button>`;
    $$(".checks input").forEach(c => c.onchange = () => c.checked ? chosen.add(c.value) : chosen.delete(c.value));
    $("#go").onclick = () => { if (!chosen.size) { toast("Pick at least one deck"); return; } run(); };
  }
  function makeValue(it) {
    const span = it.hi - it.lo;
    for (let t = 0; t < 30; t++) {
      let kind = rpick(["low", "normal", "high", "normal", "high", "low"]);
      let v = kind === "normal" ? it.lo + span * (0.12 + Math.random() * 0.76) : kind === "high" ? it.hi + span * (0.08 + Math.random() * 0.6) : it.lo - span * (0.08 + Math.random() * 0.5);
      if (v < 0) continue;
      v = r1(v, it.dec);
      const cls = v < it.lo ? "low" : v > it.hi ? "high" : "normal";
      if (v === it.lo || v === it.hi) continue;
      return { v, cls };
    }
    return { v: r1((it.lo + it.hi) / 2, it.dec), cls: "normal" };
  }
  function rangeOptions(it) {
    const out = new Set([it.text]); const fs = shuffle([0.75, 0.85, 1.15, 1.3, 0.65, 1.45]);
    for (const f of fs) { if (out.size >= 4) break; const a = r1(it.lo * f, it.dec), b = r1(it.hi * (f > 1 ? f - 0.03 : f + 0.03), it.dec); if (b > a) out.add(fmtN(a, it.dec).replace(/,/g, "") + "–" + fmtN(b, it.dec).replace(/,/g, "")); }
    return shuffle([...out]);
  }
  function run() {
    const items = decks.filter(d => chosen.has(d.id)).flatMap(rangeItems);
    const qs = Array.from({ length: 15 }, () => { const it = rpick(items); if (Math.random() < 0.7) { const { v, cls } = makeValue(it); return { it, type: "class", v, answer: cls }; } return { it, type: "range", options: rangeOptions(it), answer: it.text }; });
    let i = 0, score = 0, answered = false; const missed = [];
    function show() {
      if (i >= qs.length) return finish();
      const q = qs[i]; answered = false;
      const opts = q.type === "class" ? ["low", "normal", "high"] : q.options;
      ST.stage.innerHTML = `<div class="qcard"><div class="kicker">${esc((n => n.charAt(0).toUpperCase() + n.slice(1))(q.it.deck.name.replace(/^Reference ranges:\s*/i, "")))}</div>
        ${q.type === "class" ? `<div class="qtext">${esc(q.it.card.name)}</div><div class="bigval">${fmtN(q.v, q.it.dec)} <span>${esc(q.it.unit)}</span></div><p class="muted">Is this result low, normal or high?</p>` : `<div class="qtext">What’s the adult reference range for ${esc(q.it.card.name)}?</div>${q.it.unit ? `<p class="muted">In ${esc(q.it.unit)}</p>` : ""}`}</div>
        <div class="opts ${q.type === "class" ? "three" : "two"}" id="opts">${opts.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${k + 1}</span><span>${q.type === "class" ? o[0].toUpperCase() + o.slice(1) : esc(o)}</span></button>`).join("")}</div><div id="fb"></div>`;
      $$("#opts .opt").forEach(b => b.onclick = () => answer(opts, +b.dataset.k));
      setProg(i / qs.length); ST.right.innerHTML = `<span class="small muted">${i + 1} of ${qs.length}</span>`;
    }
    function answer(opts, k) {
      if (answered) return; answered = true;
      const q = qs[i], ok = opts[k] === q.answer; if (ok) score++; else missed.push(q);
      recordQuiz({ deck: q.it.deck, key: q.it.card.id + "::" + q.it.field }, ok);
      $("#opts").classList.add("locked");
      $$("#opts .opt").forEach((b, j) => { if (opts[j] === q.answer) b.classList.add("right"); else if (j === k) b.classList.add("wrong"); });
      const vals = q.it.card.values || {};
      const extra = q.type === "class" && q.answer !== "normal" ? (vals[q.answer === "high" ? "Increased in" : "Decreased in"] ? `<span class="det">${q.answer === "high" ? "Increased" : "Decreased"} in: ${esc(vals[q.answer === "high" ? "Increased in" : "Decreased in"])}</span>` : "") : "";
      $("#fb").innerHTML = `<div class="feedback ${ok ? "ok" : "no"}"><div style="flex:1">${ok ? "Correct" : "Answer: " + (q.type === "class" ? q.answer : esc(q.answer))}<span class="det">Reference range: ${esc(q.it.text)} ${esc(q.it.unit)}</span>${extra}</div></div>
        <div class="row" style="margin-top:12px"><div class="spacer"></div><button class="btn primary" id="next">${i + 1 < qs.length ? "Next" : "See results"}</button></div>`;
      $("#next").onclick = () => { i++; show(); };
    }
    function finish() {
      setProg(1); ST.right.innerHTML = "";
      const toReview = [...new Map(missed.map(q => [q.it.card.id, q.it])).values()];
      ST.stage.innerHTML = `<div class="results">${ring(Math.round(score / qs.length * 100))}<h2>${score} of ${qs.length} correct</h2>
        <div class="row" style="justify-content:center"><button class="btn primary" id="again">Go again</button><button class="btn" id="dn">Done</button></div>
        ${toReview.length ? `<div class="missed-list"><h3 style="margin-top:12px">Ranges to review</h3>${toReview.map(it => `<div class="card-row"><div><b>${esc(it.card.name)}</b><div class="a">${esc(it.text)} ${esc(it.unit)}</div></div></div>`).join("")}</div>` : ""}</div>`;
      $("#again").onclick = run; $("#dn").onclick = () => closeStudy();
    }
    ST.onKey = e => { if (!answered && /^[1-4]$/.test(e.key)) $(`#opts .opt[data-k="${+e.key - 1}"]`)?.click(); else if (answered && e.key === "Enter") $("#next")?.click(); };
    show();
  }
  setup();
}

  }
  setup();
}

/* ---------- Listen: hands-free audio review ---------- */
function speakable(t) {
  return String(t || "").replace(/\[…\]|\[[^\]]*\]/g, " blank ").replace(/;/g, ",").replace(/(\d)\s*[–—]\s*(\d)/g, "$1 to $2").replace(/×10³\/µL/g, " times ten to the third per microliter").replace(/×10⁶\/µL/g, " times ten to the sixth per microliter")
    .replace(/µL/g, " microliters").replace(/µm/g, " micrometers").replace(/µg/g, " micrograms").replace(/mmol\/L/g, " millimoles per liter").replace(/mg\/dL/g, " milligrams per deciliter").replace(/g\/dL/g, " grams per deciliter").replace(/\bfL\b/g, " femtoliters").replace(/\bpg\b/g, " picograms").replace(/→/g, " then ").replace(/&/g, " and ").replace(/±/g, " plus or minus ").replace(/°C/g, " degrees C").replace(/\s+/g, " ").trim();
}
function startListen(deck) {
  if (!("speechSynthesis" in window)) { toast("Audio isn’t supported in this browser"); return; }
  const decks = deck ? [deck] : Object.values(S.decks);
  let facts = decks.flatMap(factsOf).filter(f => f.kind !== "basic" || f.q);
  const due = facts.filter(f => isDue(stOf(f)) && !isSus(f));
  let queue = (due.length >= 5 ? shuffle(due) : shuffle(facts)).slice(0, 40);
  openStudy((deck ? deck.name : "All decks") + ": listen");
  if (!queue.length) { noDataScreen("Nothing to read yet", "Add cards with text to use Listen."); return; }
  const set = S.meta.settings;
  let i = 0, playing = false, token = 0, lock = null, phase = "";
  const voice = () => { const vs = speechSynthesis.getVoices(); return vs.find(v => /en[-_]US/i.test(v.lang) && /natural|premium|enhanced|samantha|google/i.test(v.name)) || vs.find(v => /^en/i.test(v.lang)); };
  const say = (text, tk) => new Promise(res => { if (tk !== token) return res(); const u = new SpeechSynthesisUtterance(speakable(text)); u.rate = set.rate || 1; const v = voice(); if (v) u.voice = v; u.lang = v ? v.lang : "en-US"; u.onend = res; u.onerror = res; speechSynthesis.speak(u); });
  const wait = (ms, tk) => new Promise(res => { const t = setTimeout(res, ms); ST.timers.push(t); });
  const texts = f => f.kind === "field" ? [`${f.q}. ${f.field}?`, f.a] : f.kind === "cloze" ? [clozePlain(f.card.text, f.idx), f.a] : [f.q, f.a];
  async function loop() {
    const tk = ++token;
    while (playing && tk === token && i < queue.length) {
      const f = queue[i]; const [q, a] = texts(f);
      phase = "q"; draw(); await say(q, tk); if (tk !== token) return;
      await wait((set.pause || 4) * 1000, tk); if (tk !== token) return;
      phase = "a"; draw(); await say(a, tk); if (tk !== token) return;
      await wait(1500, tk); if (tk !== token) return;
      i++;
    }
    if (i >= queue.length) { playing = false; stopLock(); draw(); }
  }
  async function getLock() { try { if (navigator.wakeLock) lock = await navigator.wakeLock.request("screen"); } catch { } }
  function stopLock() { try { lock && lock.release(); } catch { } lock = null; }
  function play() { if (playing) return; playing = true; getLock(); draw(); loop(); }
  function pause() { playing = false; token++; speechSynthesis.cancel(); stopLock(); draw(); }
  function jump(d) { const was = playing; pause(); i = Math.max(0, Math.min(queue.length - 1, i + d)); phase = ""; if (was) play(); else draw(); }
  function draw() {
    if (!ST) return;
    if (i >= queue.length) { ST.stage.innerHTML = `<div class="results"><h2>That’s all ${queue.length}</h2><p class="muted">Listening is great for reinforcement. Follow up with Learn to lock it in.</p><div class="row" style="justify-content:center"><button class="btn primary" id="again">Play again</button><button class="btn" id="dn">Done</button></div></div>`; $("#again").onclick = () => { i = 0; queue = shuffle(queue); play(); }; $("#dn").onclick = () => closeStudy(); setProg(1); return; }
    const f = queue[i]; const [q, a] = texts(f);
    ST.stage.innerHTML = `<div class="qcard listen"><div class="kicker">${esc(f.deck.name)} · ${i + 1} of ${queue.length}</div><div class="qtext">${esc(q)}</div><div class="answer ${phase === "a" ? "on" : ""}">${esc(a)}</div></div>
      <div class="player"><button class="btn icon" id="pv" aria-label="Previous">${icon("left")}</button><button class="btn primary big" id="pp">${playing ? "Pause" : i || phase ? "Resume" : "Start listening"}</button><button class="btn icon" id="nx" aria-label="Next">${icon("right")}</button></div>
      <div class="row" style="justify-content:center"><button class="btn sm" id="miss" style="color:var(--warn)">I missed that one</button></div>
      <p class="small muted" style="text-align:center">Keep the screen on while listening; phones pause speech when locked. Speed and pause length are in Settings.</p>`;
    $("#pp").onclick = () => playing ? pause() : play();
    $("#pv").onclick = () => jump(-1); $("#nx").onclick = () => jump(1);
    $("#miss").onclick = () => { recordQuiz(f, false); toast("It’ll come back in today’s review"); };
    setProg(i / queue.length);
  }
  const origClose = closeStudy;
  ST.confirmExit = () => { pause(); return true; };
  ST.onKey = e => { if (e.key === " ") { e.preventDefault(); playing ? pause() : play(); } else if (e.key === "ArrowRight") jump(1); else if (e.key === "ArrowLeft") jump(-1); };
  draw();
}

/* ---------- Leeches: facts you keep failing ---------- */
const isLeech = st => !!st && !st.sus && ((st.l || 0) >= 4 || (st.w || 0) >= 8);
const isSus = f => !!(stOf(f) || {}).sus;
function leechesOf(deck) { return factsOf(deck).filter(f => isLeech(stOf(f))); }
function leechModal(d) {

      ${sus.length ? `<h3 style="margin:18px 0 8px">Suspended</h3><div class="cards">${sus.map(f => `<div class="card-row" style="grid-template-columns:1fr auto"><div><b>${esc(f.kind === "field" ? f.q + ": " + f.field : f.q)}</b></div><button class="btn sm" data-unsus="${esc(f.key)}">Unsuspend</button></div>`).join("")}</div>` : ""}`;
  };
  modal(draw(), (s, close) => {
    const bind = () => {
      $$("[data-close]", s).forEach(b => b.onclick = close);
      const srs = () => (S.srs[d.id] = S.srs[d.id] || {});
      $$("[data-edit]", s).forEach(b => b.onclick = () => { const c = d.cards.find(x => x.id === b.dataset.edit); close(); editCardModal(d, c); });
      $$("[data-reset]", s).forEach(b => b.onclick = () => { delete srs()[b.dataset.reset]; saveSrs(d.id); toast("It’ll come back as a new fact"); rer(); });
      $$("[data-sus]", s).forEach(b => b.onclick = () => { const st = srs()[b.dataset.sus]; if (st) { st.sus = true; st.s = Date.now(); saveSrs(d.id); } toast("Suspended. It won’t appear in Learn"); rer(); });
      $$("[data-unsus]", s).forEach(b => b.onclick = () => { const st = srs()[b.dataset.unsus]; if (st) { delete st.sus; st.s = Date.now(); st.l = 0; st.w = 0; saveSrs(d.id); } rer(); });
    };
    const rer = () => { $(".modal", s).innerHTML = draw(); bind(); renderDeck(d); };
    bind();
  });
}

      T("Levey-Jennings charts and errors", "A Levey-Jennings chart plots each control result over time against lines for the mean and ±1, 2 and 3 SD.\n\nRandom error is unpredictable scatter, such as a bubble in a pipette. Systematic error pushes results consistently in one direction, such as a bad calibration or a deteriorating reagent. A shift is a sudden change in the mean; a trend is a gradual drift in one direction. Both are systematic."),

      T("Westgard rules", "1-2s is a warning. Rejection rules include 1-3s and R-4s, which mostly catch random error, and 2-2s, 4-1s and 10x, which catch systematic error.\n\nAccuracy is closeness to the true value; precision is reproducibility. A method can be precise without being accurate.", "", "R-4s and 1-3s catch Random error. The multi-run rules (2-2s, 4-1s, 10x) catch Systematic error.")
    ],
    quiz: [
      ["The 2-2s rule mainly detects:", ["Systematic error", "Random error", "Clerical error", "No error; it’s a warning only"], 0, "Two consecutive controls beyond the same 2 SD limit means a consistent bias."],
      ["The coefficient of variation is:", ["(SD ÷ mean) × 100", "Mean ÷ SD", "SD × mean", "Mean − SD"], 0, "CV expresses SD as a percentage of the mean."],
      ["Precision means:", ["Repeated results agree closely", "Results match the true value", "Controls are always within 1 SD", "The analyzer is calibrated"], 0, "Precision is reproducibility; accuracy is closeness to truth."],
      ["About what percentage of values fall within ±2 SD?", ["95%", "68%", "99.7%", "50%"], 0, "68, 95, 99.7."]
    ],
    terms: [["Control", "A sample with known values run to verify a test system"], ["Shift", "Sudden change in the mean"], ["Trend", "Gradual change in one direction"], ["Random error", "Unpredictable scatter"], ["Systematic error", "Consistent bias in one direction"]],
